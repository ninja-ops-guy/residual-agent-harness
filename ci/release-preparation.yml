# STAGED WORKFLOW - requires one manual step before the gate is enforced.
#
# The automation token used to author this PR lacks the `workflow` OAuth
# scope, so GitHub rejects API writes under `.github/workflows/`. A
# maintainer with a workflow-scoped token must move this file to
# `.github/workflows/release-preparation.yml` (no content changes needed).
# Until then, run locally:
#   python -m pytest tests/test_release_preparation.py -v

name: Release preparation procedures

on:
  pull_request:
    paths:
      - scripts/release/**
      - docs/release/**
      - tests/test_release_preparation.py
      - ci/release-preparation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Procedure regression tests
        run: |
          set -o pipefail
          mkdir -p runs/release-preparation
          python -m pytest tests/test_release_preparation.py -v 2>&1 | tee runs/release-preparation/tests.txt
      - name: Recovery scenarios (offline fixtures)
        run: |
          python scripts/release/recovery_check.py --out runs/release-preparation/recovery
      - name: Soak driver rehearsal (2 days, reduced load, flagged)
        run: |
          python scripts/release/soak_run.py \
            --out runs/release-preparation/soak-rehearsal \
            --days 2 --tasks-per-day 40 --allow-below-minimum \
            --station-key-hex 0011223344556677889900112233445566778899001122334455667788990011
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preparation-evidence
          path: runs/release-preparation/
          if-no-files-found: error
