name: residual-station
services:
  station:
    build: .
    image: residual-command-station:0.2.0
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - station-data:/data
      - ./projects:/projects:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  station-data:
