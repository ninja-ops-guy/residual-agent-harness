[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-agent-harness"
version = "0.3.0"
description = "A hybrid agent harness for counterexample-directed residual delegation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
residual = "residual.cli:main"
residual-station = "residual.station.server:main"
residual-worker = "residual.station.worker:main"

[tool.setuptools.packages.find]
include = ["residual*", "ai_providers*", "observation_layer*"]

[tool.setuptools.package-data]
"residual.station" = ["static/*", "schemas/*.json"]
