[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residual-agent-harness"
version = "0.5.0"
description = "A hybrid agent harness for counterexample-directed residual delegation"
readme = "README.md"
requires-python = ">=3.11.13,!=3.12.0,!=3.12.1,!=3.12.2,!=3.12.3,!=3.12.4,!=3.12.5,!=3.12.6,!=3.12.7,!=3.12.8,!=3.12.9,!=3.12.10,!=3.13.0,!=3.13.1,!=3.13.2,!=3.13.3"
dependencies = ["defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
marketplace = ["cryptography>=43"]
factory = ["cryptography>=43", "PyYAML>=6"]
test = ["pytest>=8", "PyYAML>=6"]
qualification = [
  "pytest==9.1.1",
  "PyYAML==6.0.3",
  "hypothesis==6.168.0",
  "coverage[toml]==7.16.1",
]

[project.scripts]
residual = "residual.cli:main"
residual-station = "residual.station.server:main"
residual-worker = "residual.station.worker:main"
residual-module = "residual.marketplace.cli:main"

[project.entry-points."residual.modules"]
netops = "residual.modules.netops:NetOpsModule"
secops = "residual.modules.secops:SecOpsModule"

[tool.setuptools.packages.find]
include = ["residual*", "ai_providers*", "observation_layer*"]

[tool.setuptools.package-data]
"residual.station" = ["static/*", "schemas/*.json"]

[tool.coverage.run]
branch = true
source = ["residual"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.vercel]
entrypoint = "demo.cloud_gateway.server:app"
