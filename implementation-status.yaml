# implementation-status.yaml
# Machine-readable requirement traceability manifest for the
# residual-agent-harness project. Single source of truth for "what is
# implemented". docs/status/IMPLEMENTATION_STATUS.md is generated from
# this file by scripts/status_check.py --generate; do not edit the
# generated file by hand.
#
# Status values:
#   implemented             - code paths exist and are covered by the
#                             listed tests
#   implemented_unverified  - code paths exist and are covered by the
#                             listed tests, but requirement closure
#                             (e.g. security/trust boundaries) is NOT
#                             verified; the closure field names the open
#                             work. Do not read this as "verified" or
#                             "complete".
#   partial                 - some requirements in the family are
#                             implemented; the notes field names what
#                             remains
#   not_started             - no production code exists for the family
#
# Optional fields:
#   closure          - free-text annotation describing open closure work
#                      for an implemented_unverified family
#   canonical_paths  - for not_started families, the paths where the
#                      canonical implementation is expected to live. The
#                      checker FAILS if any of these paths exists while
#                      the family is still marked not_started.
#
# The stale-doc detector (scripts/status_check.py) scans prose docs for
# "not implemented"-style claims about families whose status here is
# implemented, using each family's keywords. Files listed under
# historical_documents are frozen snapshots and are skipped.
