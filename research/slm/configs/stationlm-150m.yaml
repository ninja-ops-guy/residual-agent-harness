# stationlm-150m.yaml — StationLM architecture config (UNTRAINED; see ../SECURITY-BOUNDARY.md)
# Architecture only — no training has been or may be run before the SLM-00 freeze.
#
# Estimated parameter count: 146,157,312 (~146.16M), tied input/output embeddings.
# Arithmetic (vocab=32000, max_seq=2048, d_model=896, n_layers=12, ffn_mult=4):
#   token embedding      = 32000 * 896                = 28,672,000
#   positional embedding = 2048 * 896                 = 1,835,008
#   per layer            = attn 4*d^2 + ffn 8*d^2 + 2 LayerNorms 4*d
#                        = 12*896^2 + 4*896           = 9,637,376
#   12 layers            = 12 * 9,637,376             = 115,648,512
#   final LayerNorm      = 2*896                      = 1,792
#   lm_head              = tied to token embedding    = 0
#   total                = 146,157,312
model:
  d_model: 896
  n_layers: 12
  n_heads: 14   # head_dim = 64
  vocab_size: 32000
  max_seq: 2048
  ffn_mult: 4
  dropout: 0.0
  tie_embeddings: true
