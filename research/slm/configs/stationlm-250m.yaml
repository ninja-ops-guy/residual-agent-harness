# stationlm-250m.yaml — StationLM architecture config (UNTRAINED; see ../SECURITY-BOUNDARY.md)
# Architecture only — no training has been or may be run before the SLM-00 freeze.
#
# Estimated parameter count: 236,259,328 (~236.26M), tied input/output embeddings.
# Arithmetic (vocab=32000, max_seq=2048, d_model=1024, n_layers=16, ffn_mult=4):
#   token embedding      = 32000 * 1024               = 32,768,000
#   positional embedding = 2048 * 1024                = 2,097,152
#   per layer            = attn 4*d^2 + ffn 8*d^2 + 2 LayerNorms 4*d
#                        = 12*1024^2 + 4*1024         = 12,587,008
#   16 layers            = 16 * 12,587,008            = 201,392,128
#   final LayerNorm      = 2*1024                     = 2,048
#   lm_head              = tied to token embedding    = 0
#   total                = 236,259,328
model:
  d_model: 1024
  n_layers: 16
  n_heads: 16   # head_dim = 64
  vocab_size: 32000
  max_seq: 2048
  ffn_mult: 4
  dropout: 0.0
  tie_embeddings: true
