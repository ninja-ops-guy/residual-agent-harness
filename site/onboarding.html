<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RESIDUAL // Onboarding</title><style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#050706;color:#d7ffe0}*{box-sizing:border-box}body{margin:0;background:#050706}.wrap{max-width:980px;margin:auto;padding:28px}.brand{color:#55ff7b;font-weight:800;letter-spacing:.15em}.muted{color:#78907e}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:24px 0}.step{border:1px solid #27472f;padding:10px;text-align:center;font-size:11px}.step.on{border-color:#55ff7b;background:#0d2413}.panel{border:1px solid #27472f;padding:22px;background:#07100a}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid #27472f;background:#020503;color:#d7ffe0;font:inherit;cursor:pointer}.choice.selected{border-color:#55ff7b}.gate{display:flex;justify-content:space-between;border-top:1px solid #17331f;padding:9px 0;font-size:12px}.ok{color:#55ff7b}.warn{color:#ffd66b}button.next{margin-top:18px;background:#55ff7b;color:#031006;border:0;padding:12px 18px;font:inherit;font-weight:800}.hidden{display:none}@media(max-width:700px){.steps{grid-template-columns:1fr}.step{display:none}.step.on{display:block}}</style></head><body><div class="wrap"><div class="brand">RESIDUAL // FIRST RUN</div><p class="muted">Progressive onboarding. No privileged capability is granted by this browser.</p><div class="steps" id="steps"></div><section class="panel" id="panel"></section></div>
<script>
const stages=['UNDERSTAND','PROVIDER','COMPUTE','CAPABILITIES','PREFLIGHT'];let i=0,state={provider:null,compute:null,cap:'read-only'};
const steps=document.getElementById('steps'),panel=document.getElementById('panel');
function drawSteps(){steps.innerHTML=stages.map((s,n)=>'<div class="step '+(n===i?'on':'')+'">'+(n+1)+' // '+s+'</div>').join('')}
function choice(k,v,label){return '<button class="choice '+(state[k]===v?'selected':'')+'" onclick="pick(\''+k+'\',\''+v+'\')">'+label+'</button>'}
function render(){drawSteps();let h='';
if(i===0)h='<h2>Understand the boundary</h2><p>RESIDUAL separates the web control plane from execution. The browser requests work; server-side policy decides what is allowed; isolated workers execute it; evidence remains authoritative outside the UI.</p><div class="gate"><span>Browser has worker credentials</span><b class="ok">NO</b></div><div class="gate"><span>Client can self-approve actions</span><b class="ok">NO</b></div>';
if(i===1)h='<h2>Select a provider profile</h2><p class="muted">This preview records preference only. No keys are requested or stored.</p>'+choice('provider','ollama','Local Ollama — keep inference local')+choice('provider','cloud','Cloud provider — server-side secret required later')+choice('provider','hybrid','Hybrid — local + cloud routing');
if(i===2)h='<h2>Select execution</h2><p class="muted">Real worker enrollment is disabled until qualification.</p>'+choice('compute','local','Local RESIDUAL worker')+choice('compute','remote','Isolated remote worker')+choice('compute','demo','Disposable demo worker');
if(i===3)h='<h2>Start with least privilege</h2>'+choice('cap','read-only','Read-only — inspect/analyze, no mutation')+choice('cap','bounded-write','Bounded write — locked until authenticated qualification')+'<div class="gate"><span>Factory / privileged MCP</span><b class="warn">LOCKED</b></div>';
if(i===4)h='<h2>Preflight qualification</h2>'+gate('Identity','PREVIEW')+gate('Provider',state.provider?'CONFIGURED':'BLOCKED')+gate('Worker handshake',state.compute?'SCRIPTED':'BLOCKED')+gate('Worker isolation','NOT YET TESTED')+gate('Evidence Bus','SCRIPTED')+gate('Verifier','SCRIPTED')+gate('Tool policy',state.cap==='read-only'?'READ-ONLY':'LOCKED')+gate('Secret exposure','NO SECRETS ACCEPTED')+'<p class="muted">This onboarding preview never labels the environment QUALIFIED. Real qualification requires server-authoritative WEB-F gates.</p>';
panel.innerHTML=h+(i<4?'<button class="next" onclick="next()">CONTINUE →</button>':'<button class="next" onclick="location.href=\'command-station.html\'">ENTER DEMO COMMAND STATION →</button>')}
function gate(a,b){const good=!/BLOCKED|NOT YET|LOCKED/.test(b);return '<div class="gate"><span>'+a+'</span><b class="'+(good?'ok':'warn')+'">'+b+'</b></div>'}
window.pick=(k,v)=>{if(k==='cap'&&v==='bounded-write')return;state[k]=v;render()};window.next=()=>{if(i===1&&!state.provider)return;if(i===2&&!state.compute)return;i++;render()};render();
</script></body></html>
