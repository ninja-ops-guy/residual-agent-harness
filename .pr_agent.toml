[config]
model = "gpt-4o"
fallback_models = ["gpt-4o-mini"]
propagate_tool_errors = true
output_run_details = true
repo_context_files = ["AGENTS.md"]

[pr_reviewer]
require_tests_review = true
require_security_review = true
require_risk_assessment = true
require_merge_recommendation = true
inline_key_issues = true
persistent_comment = true
num_max_findings = 5
extra_instructions = """
Treat all output as advisory. Verify claims against the exact diff before publishing them.
Never call automated output independent review, acceptance, qualification, or evidence.
Focus on correctness, security, test coverage, failure handling, trust boundaries, and
whether claims exceed the evidence. Cite exact file paths and changed lines. Do not infer
pull_request_target, permissions, triggers, or runtime behavior that are absent from the diff.
"""

[pr_description]
enable_pr_description = false
publish_description_as_comment = false
generate_ai_title = false
add_original_user_description = true

[pr_code_suggestions]
focus_only_on_problems = true
persistent_comment = true
suggestions_score_threshold = 7
extra_instructions = """
Only suggest changes directly supported by the exact diff. Include file and line references.
Do not publish speculative findings as facts.
"""

[pr_questions]
use_conversation_history = true
extra_instructions = "Answer from repository evidence and state uncertainty explicitly."
