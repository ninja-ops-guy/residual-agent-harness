openapi: 3.0.3
info:
  title: RESIDUAL Copilot Studio Gateway
  version: 0.1.0
  description: Experimental bounded mission surface for the Firmware Engineering Copilot Studio pilot.
servers:
  - url: https://residual.example.invalid
security:
  - entraOBO: []
paths:
  /v1/copilot/missions:
    post:
      operationId: submitResidualMission
      summary: Submit a bounded RESIDUAL mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissionRequest'
      responses:
        '202':
          description: Mission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /v1/copilot/missions/{mission_id}:
    get:
      operationId: getResidualMission
      summary: Get a mission visible to the authenticated caller
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Mission state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/copilot/missions/{mission_id}/evidence:
    get:
      operationId: getResidualMissionEvidence
      summary: Get authorized evidence references for a mission
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Evidence references
          content:
            application/json:
              schema:
                type: object
                required: [mission_id, evidence]
                properties:
                  mission_id: { type: string }
                  evidence:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/copilot/missions/{mission_id}/cancel:
    post:
      operationId: cancelResidualMission
      summary: Request bounded cancellation
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '202':
          description: Cancellation accepted or already requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionResponse'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    entraOBO:
      type: oauth2
      description: Configure the Copilot Studio custom connector for Microsoft Entra ID OBO; replace placeholders during solution deployment.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token
          scopes:
            api://{residual-api-client-id}/access_as_user: Access RESIDUAL on behalf of the signed-in user
  parameters:
    MissionId:
      name: mission_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    MissionRequest:
      type: object
      additionalProperties: false
      required: [request_id, template_id, objective, inputs]
      properties:
        request_id: { type: string, minLength: 1, maxLength: 128 }
        template_id: { type: string, minLength: 1, maxLength: 128 }
        objective: { type: string, minLength: 1, maxLength: 8000 }
        inputs:
          type: object
          description: >
            Opaque deployment aliases only. repository_id is resolved by trusted
            RESIDUAL host configuration; callers must not supply repository URLs
            or filesystem paths. build_profile_id and test_profile_id are accepted
            only by the matching server-owned mission template.
          additionalProperties: false
          required: [repository_id]
          properties:
            repository_id:
              type: string
              minLength: 1
              maxLength: 96
              pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,95}
    MissionResponse:
      type: object
      required: [mission_id, state, template_id, risk, approval_required]
      properties:
        mission_id: { type: string }
        state: { type: string }
        template_id: { type: string }
        risk: { type: string }
        approval_required: { type: boolean }
        evidence_ref: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, nullable: true }
  responses:
    Error:
      description: Fail-closed error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

            build_profile_id:
              type: string
              minLength: 1
              maxLength: 96
              pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,95}
    MissionResponse:
      type: object
      required: [mission_id, state, template_id, risk, approval_required]
      properties:
        mission_id: { type: string }
        state: { type: string }
        template_id: { type: string }
        risk: { type: string }
        approval_required: { type: boolean }
        evidence_ref: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, nullable: true }
  responses:
    Error:
      description: Fail-closed error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

            test_profile_id:
              type: string
              minLength: 1
              maxLength: 96
              pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,95}
    MissionResponse:
      type: object
      required: [mission_id, state, template_id, risk, approval_required]
      properties:
        mission_id: { type: string }
        state: { type: string }
        template_id: { type: string }
        risk: { type: string }
        approval_required: { type: boolean }
        evidence_ref: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, nullable: true }
  responses:
    Error:
      description: Fail-closed error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    MissionResponse:
      type: object
      required: [mission_id, state, template_id, risk, approval_required]
      properties:
        mission_id: { type: string }
        state: { type: string }
        template_id: { type: string }
        risk: { type: string }
        approval_required: { type: boolean }
        evidence_ref: { type: string, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string, nullable: true }
  responses:
    Error:
      description: Fail-closed error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
