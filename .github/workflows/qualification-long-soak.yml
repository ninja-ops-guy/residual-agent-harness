name: RESIDUAL long wall-clock soak

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Uninterrupted wall-clock soak tier
        required: true
        type: choice
        options: [24h, 72h]
        default: 24h

permissions:
  contents: read

concurrency:
  group: qualification-long-soak-${{ inputs.tier }}
  cancel-in-progress: false

jobs:
  long-soak:
    # GitHub-hosted runners cannot provide the required uninterrupted duration.
    # A persistent self-hosted qualification runner is intentional here.
    runs-on: self-hosted
    timeout-minutes: ${{ inputs.tier == '24h' && 1500 || 4500 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install '.[factory,qualification]'
      - name: Run uninterrupted soak
        run: |
          python scripts/qualification_long_soak.py \
            --tier '${{ inputs.tier }}' \
            --output-dir 'runs/qualification-long-${{ inputs.tier }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-long-${{ inputs.tier }}-${{ github.sha }}-${{ github.run_id }}
          path: runs/qualification-long-${{ inputs.tier }}
          if-no-files-found: error
          retention-days: 90
