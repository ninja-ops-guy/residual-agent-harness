name: GitHub Pages demo

on:
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/pages-demo.yml'
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: residual-demo-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build demo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Syntax and deterministic model checks
        run: |
          node --check demo/site/app.mjs
          node --check demo/site/model.mjs
          node --test demo/tests/model.test.mjs
      - name: Public asset and build safety checks
        run: python -m unittest discover -s demo/tests -p 'test_*.py' -v
      - name: Build allowlisted public files with exact source revision
        run: python demo/build.py --output _site --revision "$GITHUB_SHA"
      - name: Install browser QA dependencies
        run: |
          python -m pip install -r demo/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Desktop, mobile, project-path and security browser checks
        run: python demo/tests/browser.py --site _site --screenshots demo-qa
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-browser-screenshots
          path: demo-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload validated public site only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Publish reviewed main to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (enable GitHub Actions source in repository settings first)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
