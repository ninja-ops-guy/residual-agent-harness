name: Deployment integration evidence
on:
  push:
    branches: [feat/deployment-gap-closure]
  pull_request:
    paths:
      - 'residual/**'
      - 'tests/**'
      - 'examples/deployment/**'
      - 'scripts/review_ui_smoke.py'
      - 'pyproject.toml'
      - '.github/workflows/deployment-integration.yml'
permissions:
  contents: read
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESIDUAL_MDNS_TEST_INTERFACE: '127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact source snapshot
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git archive --format=zip HEAD -o evidence/source.zip
      - name: Install explicit optional integrations
        run: |
          python -m pip install '.[mesh,hitl,marketplace]' playwright
          python -c 'import zeroconf, websockets, cryptography, jwt, aiohttp'
          python -m pip freeze > evidence/dependencies.txt
      - name: Unit, TLS, auth, lifecycle and multicast contracts
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee evidence/tests.txt
      - name: Execute documented lifecycle example
        run: python -m examples.deployment.lifecycle
      - name: Build candidate wheel and prove observation_layer is bundled
        run: |
          python -m pip wheel . --no-deps -w evidence/dist
          python -m venv /tmp/residual-wheel-smoke
          /tmp/residual-wheel-smoke/bin/python -m pip install --no-deps evidence/dist/*.whl
          cd /tmp
          /tmp/residual-wheel-smoke/bin/python -I -c "import residual, observation_layer, residual.hitl, residual.mesh, residual.station.deployment; from importlib.resources import files; assert (files('residual.hitl')/'static'/'index.html').is_file(); assert 'site-packages' in observation_layer.__file__"
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Mobile operator review browser smoke
        env:
          PYTHONPATH: '.'
        run: python scripts/review_ui_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 7
