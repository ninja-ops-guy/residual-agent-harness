name: Release preparation procedures

on:
  pull_request:
    paths:
      - scripts/release/**
      - docs/release/**
      - tests/test_release_preparation.py
      - .github/workflows/release-preparation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install procedure test dependency
        run: python -m pip install pytest
      - name: Procedure regression tests
        run: |
          set -o pipefail
          mkdir -p runs/release-preparation
          python -m pytest tests/test_release_preparation.py -v 2>&1 | tee runs/release-preparation/tests.txt
      - name: Recovery scenarios (offline fixtures)
        run: |
          python scripts/release/recovery_check.py --out runs/release-preparation/recovery
      - name: Soak driver rehearsal (2 days, reduced load, flagged)
        run: |
          python scripts/release/soak_run.py \
            --out runs/release-preparation/soak-rehearsal \
            --days 2 --tasks-per-day 40 --allow-below-minimum \
            --station-key-hex 0011223344556677889900112233445566778899001122334455667788990011
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-preparation-evidence-${{ github.sha }}
          path: runs/release-preparation/
          if-no-files-found: error
          retention-days: 14
