name: GitHub Action Pin Gate

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/validate_github_action_pins.py'
      - 'tests/test_github_action_pins.py'
      - 'tests/test_github_action_pin_set.py'
      - 'tests/test_checkout_credentials.py'
      - 'tests/test_pages_main_qualification_gate.py'
      - 'docs/v1/V1_GITHUB_ACTION_PIN_SET.json'
      - 'docs/v1/V1_SUPPLY_CHAIN_ACTION_PINNING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Provision structural workflow parser
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Verify immutable action pins and existing workflow security contracts
        run: |
          python -m unittest -v \
            tests/test_github_action_pins.py \
            tests/test_github_action_pin_set.py \
            tests/test_checkout_credentials.py \
            tests/test_pages_main_qualification_gate.py
          mkdir -p runs/action-pin-gate
          python scripts/validate_github_action_pins.py \
            --output runs/action-pin-gate/action-pin-audit.json
      - name: Retain action pin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-action-pin-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/action-pin-gate/
          retention-days: 14
          if-no-files-found: warn
