name: Factory OS execution evidence
on:
  pull_request:
    paths:
      - 'residual/factory/**'
      - 'tests/test_factory_worker_contract.py'
      - 'tests/test_factory_runtime.py'
      - 'tests/test_factory_evidence_bus.py'
      - 'tests/test_factory_m4.py'
      - 'tests/test_factory_eval.py'
      - 'tests/test_factory_eval_driver.py'
      - 'tests/test_factory_fb001.py'
      - 'tests/test_factory_fb002.py'
      - 'tests/test_factory_fb003.py'
      - 'tests/test_factory_fb004.py'
      - 'tests/test_factory_corpus.py'
      - 'tests/test_factory_doctor.py'
      - 'residual/engines/**'
      - 'benchmarks/factory/**'
      - 'scripts/setup_factory.sh'
      - 'examples/factory/**'
      - 'docs/factory/**'
      - 'pyproject.toml'
      - '.github/workflows/factory-execution.yml'
permissions:
  contents: read
jobs:
  linux-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install kernel and Factory crypto dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libseccomp2
          python -m pip install 'cryptography>=43' build
      - name: Preserve exact source
        run: |
          mkdir -p runs/factory-execution
          git rev-parse HEAD > runs/factory-execution/commit.txt
          git rev-parse HEAD^{tree} > runs/factory-execution/tree.txt
          git archive --format=zip HEAD -o runs/factory-execution/source.zip
          uname -a > runs/factory-execution/platform.txt
          python --version >> runs/factory-execution/platform.txt
          dpkg-query -W libseccomp2 >> runs/factory-execution/platform.txt
      - name: Real OS-boundary and Factory regression tests
        env:
          RESIDUAL_REQUIRE_SECCOMP: '1'
        run: |
          set -o pipefail
          python -m unittest tests.test_factory_worker_contract tests.test_factory_runtime tests.test_factory_evidence_bus tests.test_factory_m4 tests.test_factory_eval tests.test_factory_eval_driver tests.test_factory_fb001 tests.test_factory_fb002 tests.test_factory_fb003 tests.test_factory_fb004 tests.test_factory_corpus tests.test_factory_doctor -v 2>&1 | tee runs/factory-execution/execution-tests.txt
          python -m unittest discover -s tests -v 2>&1 | tee runs/factory-execution/full-tests.txt
          python -m compileall -q residual/factory residual/engines benchmarks/factory/fb001 benchmarks/factory/fb002 benchmarks/factory/fb003 benchmarks/factory/fb004 benchmarks/factory/corpus
      - name: Fresh wheel install and first-run CLI
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/residual-wheel"
          WHEEL=$(ls dist/*.whl | head -1)
          "$RUNNER_TEMP/residual-wheel/bin/python" -m pip install "$WHEEL[factory]"
          "$RUNNER_TEMP/residual-wheel/bin/python" -m residual doctor --help
          "$RUNNER_TEMP/residual-wheel/bin/python" -m residual doctor --json "$RUNNER_TEMP/wheel-host-profile.json"
          cp "$RUNNER_TEMP/wheel-host-profile.json" runs/factory-execution/wheel-host-profile.json
      - name: Scripted end-to-end execution
        run: |
          python examples/factory/brokered_worker_demo.py --output "$RUNNER_TEMP/residual-m2-demo"
          cp "$RUNNER_TEMP/residual-m2-demo/result.json" runs/factory-execution/demo-result.json
          cp "$RUNNER_TEMP/residual-m2-demo/observations.jsonl" runs/factory-execution/demo-observations.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-os-evidence-${{ github.sha }}
          path: runs/factory-execution
