name: Qualification status integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML pytest
      - name: Check both traceability and current-summary invariants
        run: |
          python scripts/status_check.py
          python scripts/check_current_status.py
      - name: Regression tests for the guard and diagnostic runner
        run: python -m pytest tests/test_qualification_status.py tests/test_qualification_diagnostics.py -v
