name: M6-SPEC-007G general-model autonomous discovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m6-spec-007g:
    if: github.head_ref == 'experiment/m6-spec-007g-general-scientist'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11449
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Syntax-check experiment
        run: python -m py_compile scripts/m6_spec_007g.py
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-m6-spec-007g.log 2>&1 &
          echo $! > /tmp/ollama-m6-spec-007g.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11449/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6-spec-007g.log
          exit 1
      - name: Pull analysis model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          ollama --version
          ollama list | tee /tmp/ollama-models-m6-spec-007g.txt
          sha256sum scripts/m6_spec_007g.py | tee /tmp/m6-spec-007g-script-sha256.txt
      - name: Execute authoritative general-model discovery trial
        run: python scripts/m6_spec_007g.py --model "$OLLAMA_MODEL" --base-url http://127.0.0.1:11449 --output runs/m6-spec-007g/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-spec-007g/evidence.json || cat runs/m6-spec-007g/evidence.json
          tail -300 /tmp/ollama-m6-spec-007g.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-spec-007g-general-model-discovery
          path: |
            runs/m6-spec-007g
            /tmp/ollama-m6-spec-007g.log
            /tmp/ollama-m6-spec-007g.pid
            /tmp/ollama-models-m6-spec-007g.txt
            /tmp/m6-spec-007g-script-sha256.txt
