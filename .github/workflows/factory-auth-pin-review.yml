name: Factory AUTH pin exact-head review
on:
  pull_request:
    branches: ['review/v1-mission-auth-openclaw-composition']
permissions:
  contents: read
jobs:
  review:
    if: github.head_ref == 'review/pr527-factory-auth-pin-20261005'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze exact head, tree, reviewed delta and non-authority status
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/factory-pin-review"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor f9c1a82b381420d4337391f0803983fb178cd197 HEAD
          test "$(git rev-parse HEAD:residual/factory/worker_contract.py)" = de992173576b03ee0882d8fb713ea06f02a66d80
          git rev-parse HEAD > "$RUNNER_TEMP/factory-pin-review/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/factory-pin-review/tree.txt"
          git diff --exit-code HEAD --
          git diff --name-only f9c1a82b381420d4337391f0803983fb178cd197 HEAD > "$RUNNER_TEMP/factory-pin-review/changed-paths.txt"
          printf '%s\n' .github/workflows/factory-auth-pin-review.yml verifier/v3/factory_ownership_baseline.json > "$RUNNER_TEMP/factory-pin-review/expected-paths.txt"
          diff -u "$RUNNER_TEMP/factory-pin-review/expected-paths.txt" "$RUNNER_TEMP/factory-pin-review/changed-paths.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/factory-pin-review/source.tar.gz"
          printf '%s\n' 'PROPOSED_BASELINE_ONLY; OWNER_APPROVAL_PENDING; RELEASE_AUTHORIZED=false; V1_RELEASE_HOLD' > "$RUNNER_TEMP/factory-pin-review/non-authority.txt"
      - name: Install test dependencies
        run: python -m pip install -e '.[factory,test]'
      - name: Exact-head Factory ownership check
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python verifier/v3/check_factory_ownership.py 2>&1 | tee "$RUNNER_TEMP/factory-pin-review/ownership.log"
      - name: Ownership mutations, worker, runtime, AUTH and approval regressions
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python -m pytest -q tests/test_factory_worker_contract.py tests/test_factory_ownership_gate.py tests/test_factory_runtime.py tests/test_factory_evidence_bus.py tests/test_eval_frozen_acceptance_binding.py tests/qualification/test_auth_compound.py tests/qualification/test_authority_kernel.py tests/qualification/test_authority_wheel_inputs.py tests/test_maintainer_approval_gate.py --junitxml="$RUNNER_TEMP/factory-pin-review/focused.xml" 2>&1 | tee "$RUNNER_TEMP/factory-pin-review/focused.log"
      - name: Exact-head clean-install qualification outside checkout
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python verifier/v3/qualify_clean_install.py --source-root "$GITHUB_WORKSPACE" --work-dir "$RUNNER_TEMP/factory-pin-clean" --output "$RUNNER_TEMP/factory-pin-review/clean-install.json" 2>&1 | tee "$RUNNER_TEMP/factory-pin-review/clean-install.log"
      - name: Exact-head measured-binding and adjacent qualification
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python verifier/v3/check_factory_ownership.py
          python -m pytest tests/test_eval_frozen_acceptance_binding.py tests/test_factory_m4_integrator.py tests/test_factory_m4_sandbox.py tests/test_factory_m4_scheduler.py tests/test_factory_m4_evidence.py tests/test_factory_evidence_bus.py tests/test_eval_runner.py tests/test_eval_workload.py tests/test_eval_stats.py tests/test_clean_install_qualification.py -q --junitxml="$RUNNER_TEMP/factory-pin-review/measured-adjacent.xml" 2>&1 | tee "$RUNNER_TEMP/factory-pin-review/measured-adjacent.log"
      - name: Verify source remained unchanged
        if: ${{ !cancelled() }}
        run: git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-auth-pin-python-${{ matrix.python }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/factory-pin-review/
            ${{ runner.temp }}/factory-pin-clean/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
