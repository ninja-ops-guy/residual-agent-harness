name: Residual Studio checks
on:
  pull_request:
    paths:
      - 'studio/**'
      - 'residual/factory/studio_api.py'
      - 'residual/factory/studio_control.py'
      - 'tests/test_factory_studio_*.py'
      - '.github/workflows/studio.yml'
permissions:
  contents: read
jobs:
  python-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Factory dependencies
        run: python -m pip install -e '.[factory]'
      - name: Studio API and control tests
        run: python -m unittest tests.test_factory_studio_api tests.test_factory_studio_control -v
      - name: Compile Studio Python boundary
        run: python -m compileall -q residual/factory/studio_api.py residual/factory/studio_control.py
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: studio/package-lock.json}
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
