name: M6-SPEC-007C minimal-context autonomous discovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m6-spec-007c:
    if: github.head_ref == 'experiment/m6-spec-007c-external-verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11445
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5-coder:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Syntax-check external hypothesis verifier
        run: python -m py_compile scripts/m6_spec_007_check.py
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-m6-spec-007c.log 2>&1 &
          echo $! > /tmp/ollama-m6-spec-007c.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11445/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6-spec-007c.log
          exit 1
      - name: Pull analysis model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          ollama --version
          ollama list | tee /tmp/ollama-models-m6-spec-007c.txt
          sha256sum scripts/m6_spec_007_check.py | tee /tmp/m6-spec-007c-checker-sha256.txt
      - name: Execute authoritative autonomous-discovery trial
        run: python scripts/m6_spec_007.py --model "$OLLAMA_MODEL" --base-url http://127.0.0.1:11445 --output runs/m6-spec-007c/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-spec-007c/evidence.json || cat runs/m6-spec-007c/evidence.json
          tail -300 /tmp/ollama-m6-spec-007c.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-spec-007c-autonomous-discovery-evidence
          path: |
            runs/m6-spec-007c
            /tmp/ollama-m6-spec-007c.log
            /tmp/ollama-m6-spec-007c.pid
            /tmp/ollama-models-m6-spec-007c.txt
            /tmp/m6-spec-007c-checker-sha256.txt
