name: Mission composed authority and installed wheel
on:
  pull_request:
    paths:
      - 'residual/**'
      - 'integrations/mission-sync/**'
      - 'tests/test_mission_composed_authority.py'
      - 'scripts/prove_mission_wheel.py'
      - '.github/workflows/mission-convergence.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'tests/qualification/test_authority_wheel_inputs.py'
      - 'AUTH_INVARIANTS.md'
permissions:
  contents: read
jobs:
  composed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Bind software evidence to exact head and input ancestries
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mc-proof"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD > "$RUNNER_TEMP/mc-proof/head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/mc-proof/tree.txt"
          for input in ec4df5a734054fd8f2fa0ef32f4061a42f5bdf82 b16482bf589566197d970a30053fd3fea6b628ff 7c35f72863e1631d4675c82f459b717a53b53bd9; do
            git merge-base --is-ancestor "$input" HEAD
          done
          git diff --exit-code HEAD --
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/mc-proof/source.tar.gz"
      - name: Install source test dependencies
        run: python -m pip install -e '.[factory,test]'
      - name: Real Station HTTP Python and Node composition tests
        run: |
          set -o pipefail
          python -m pytest tests/test_mission_composed_authority.py tests/qualification/test_authority_kernel.py tests/qualification/test_authority_wheel_inputs.py -v --junitxml="$RUNNER_TEMP/mc-proof/source-tests.xml" 2>&1 | tee "$RUNNER_TEMP/mc-proof/source-tests.log"
      - name: Installed wheel outside checkout with poisoned cwd
        if: ${{ always() && !cancelled() }}
        run: python scripts/prove_mission_wheel.py --output "$RUNNER_TEMP/mc-proof/wheel"
      - name: Retain exact source and software-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mission-composition-python-${{ matrix.python }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/mc-proof/
          if-no-files-found: error
          retention-days: 7
