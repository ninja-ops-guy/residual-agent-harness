name: M6 ImprovementSpec self-host experiment
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m6-improvementspec:
    if: github.head_ref == 'experiment/m6-improvementspec-self-host'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5-coder:1.5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama-m6.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6.log
          exit 1
      - name: Pull real local model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Run RESIDUAL self-host experiment
        run: python scripts/m6_improvementspec_experiment.py --model "$OLLAMA_MODEL" --output runs/m6-improvementspec/evidence.json
      - name: Show evidence
        if: always()
        run: |
          test ! -f runs/m6-improvementspec/evidence.json || cat runs/m6-improvementspec/evidence.json
          echo "--- ollama log ---"
          tail -200 /tmp/ollama-m6.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-improvementspec-research-evidence
          path: |
            runs/m6-improvementspec
            /tmp/ollama-m6.log
