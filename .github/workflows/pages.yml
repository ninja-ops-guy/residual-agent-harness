name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'index.html'
      - 'demo.html'
      - 'demo/**'
      - 'residual/browser_bridge.py'
      - 'examples/onboarding/cloud_demo.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RESIDUAL
        uses: actions/checkout@v4

      - name: Build static site shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/demo _site/walkthrough _site/vm _site/site
          cp site/index.html _site/index.html
          cp site/demo.html _site/walkthrough/index.html
          cp site/walkthrough-persist.js _site/walkthrough/persist.js
          printf '\n<script src="./persist.js"></script>\n' >> _site/walkthrough/index.html
          cat > _site/demo.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./demo/"><script>location.replace('./demo/')</script><title>RESIDUAL Live Demo</title><body style="background:#000;color:#39ff68;font:16px monospace">Launching <a style="color:#39ff68" href="./demo/">RESIDUAL live VM</a>…</body>
          EOF
          cat > _site/site/demo.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../demo/"><script>location.replace('../demo/')</script><title>RESIDUAL Live Demo</title><body style="background:#000;color:#39ff68;font:16px monospace">This URL moved. Launching <a style="color:#39ff68" href="../demo/">RESIDUAL live VM</a>…</body>
          EOF
          cat > _site/vm/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../demo/"><script>location.replace('../demo/')</script><title>RESIDUAL Live Demo</title><body style="background:#000;color:#39ff68;font:16px monospace">The VM moved to <a style="color:#39ff68" href="../demo/">/demo/</a>.</body>
          EOF
          touch _site/.nojekyll

      - name: Checkout WebVM runtime
        uses: actions/checkout@v4
        with:
          repository: leaningtech/webvm
          ref: main
          path: _webvm

      - name: Prepare minimal RESIDUAL VM image
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='_site' --exclude='_webvm' ./ _webvm/residual-src/
          cp demo/vm/Dockerfile _webvm/dockerfiles/residual_demo
          docker build _webvm --tag residual-webvm-demo --file _webvm/dockerfiles/residual_demo --platform=linux/386

      - name: Export VM filesystem
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker create residual-webvm-demo)"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true; sudo umount /mnt/residual-webvm >/dev/null 2>&1 || true' EXIT
          sudo mkdir -p /mnt/residual-webvm
          sudo fallocate -l 320M residual-demo.ext2
          sudo mkfs.ext2 -q -r 0 residual-demo.ext2
          sudo mount -o loop -t ext2 residual-demo.ext2 /mnt/residual-webvm
          sudo docker cp -a "${CONTAINER_ID}:/" /mnt/residual-webvm/
          sudo test -x /mnt/residual-webvm/bin/bash
          sudo test -x /mnt/residual-webvm/usr/local/bin/residual-demo-shell
          sudo test -f /mnt/residual-webvm/home/residual/.bashrc
          sudo test -f /mnt/residual-webvm/opt/residual/pyproject.toml
          sudo grep -q 'RESIDUAL BOOT: guest process attached' /mnt/residual-webvm/usr/local/bin/residual-demo-shell
          sudo umount /mnt/residual-webvm
          docker rm "$CONTAINER_ID" >/dev/null
          trap - EXIT
          # Match WebVM's official GitHub Pages layout: the image chunks live
          # beside the WebVM build that consumes them.
          sudo split residual-demo.ext2 _site/demo/residual-demo.ext2.c -a 6 -b 128k -x --additional-suffix=.txt
          stat -c%s residual-demo.ext2 | sudo tee _site/demo/residual-demo.ext2.meta >/dev/null
          sudo chmod -R a+rX _site/demo

      - name: Configure WebVM for RESIDUAL
        shell: bash
        run: |
          set -euo pipefail
          cat > _webvm/config_github_terminal.js <<'EOF'
          export const diskImageUrl = "residual-demo.ext2";
          export const diskImageType = "github";
          export const printIntro = false;
          export const needsDisplay = false;
          export const cmd = "/usr/local/bin/residual-demo-shell";
          export const args = [];
          export const opts = {env:["HOME=/home/residual","TERM=xterm","USER=residual","SHELL=/bin/bash","EDITOR=vi","LANG=C","LC_ALL=C","PYTHONUNBUFFERED=1","RESIDUAL_DEMO_MODEL=gpt-5.6-luna"],cwd:"/opt/residual",uid:1000,gid:1000};
          EOF

      - name: Add Residual cloud bridge and readiness UI to WebVM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_webvm/src/lib/WebVM.svelte')
          text = path.read_text()

          anchor = '\tvar sideBarPinned = false;'
          bridge = r'''
	var residualBridgeBuffer = "";
	var residualCloudReady = false;
	var residualCloudLabel = "ENABLE CLOUD ✦";
	var residualVmState = "VM BOOTING…";
	function residualDecode64url(s)
	{
		s=s.replace(/-/g,"+").replace(/_/g,"/");
		while(s.length%4)s+="=";
		const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
		return new TextDecoder().decode(bytes);
	}
	function residualEncode64url(text)
	{
		const bytes=new TextEncoder().encode(text);let bin="";
		for(const b of bytes)bin+=String.fromCharCode(b);
		return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
	}
	function residualPuterText(result)
	{
		if(typeof result==="string")return result;
		const c=result?.message?.content;
		if(typeof c==="string")return c;
		if(Array.isArray(c))return c.map(p=>typeof p==="string"?p:(p?.text||p?.content||"")).join("");
		if(typeof result?.text==="string")return result.text;
		if(typeof result?.content==="string")return result.content;
		throw new Error("Puter returned no text content");
	}
	function residualSend(id,obj)
	{
		if(cxReadFunc==null)return;
		const wire=`__RESIDUAL_BROWSER_RESPONSE__:${id}:${residualEncode64url(JSON.stringify(obj))}\n`;
		readData(wire);
	}
	async function residualHandleLine(line)
	{
		const m=line.match(/^__RESIDUAL_BROWSER_REQUEST__:([0-9a-f]+):([A-Za-z0-9_-]+)$/);
		if(!m)return;
		const id=m[1];let req;
		try{req=JSON.parse(residualDecode64url(m[2]));}catch(e){residualSend(id,{ok:false,error:"browser_bridge_invalid_request"});return;}
		if(!residualCloudReady||!window.puter?.ai){residualSend(id,{ok:false,error:"browser_bridge_auth_required"});return;}
		residualVmState="CLOUD INFERENCE…";
		try
		{
			const maxTokens=Number.isInteger(req.max_output_tokens)?Math.max(1,Math.min(req.max_output_tokens,512)):256;
			const result=await window.puter.ai.chat(req.messages,{model:req.model||"gpt-5.6-luna",max_tokens:maxTokens,normalize:true});
			const usage=result?.usage||{};
			residualSend(id,{ok:true,text:residualPuterText(result),finish_reason:result?.finish_reason||result?.message?.finish_reason||"stop",usage:{input_tokens:Number.isInteger(usage.prompt_tokens)?usage.prompt_tokens:(Number.isInteger(usage.input_tokens)?usage.input_tokens:null),output_tokens:Number.isInteger(usage.completion_tokens)?usage.completion_tokens:(Number.isInteger(usage.output_tokens)?usage.output_tokens:null)}});
			residualVmState="VM READY · CLOUD RESPONSE RETURNED";
		}
		catch(e)
		{
			console.warn("Puter inference failed",e);
			residualSend(id,{ok:false,error:"browser_bridge_remote_error"});
			residualVmState="VM READY · CLOUD REQUEST FAILED";
		}
	}
	async function enableResidualCloud()
	{
		residualCloudLabel="LOADING CLOUD…";
		try
		{
			if(!window.puter?.auth)throw new Error("Puter SDK unavailable");
			if(!window.puter.auth.isSignedIn?.())await window.puter.auth.signIn({attempt_temp_user_creation:true});
			const user=await window.puter.auth.getUser();
			residualCloudReady=true;
			residualCloudLabel="CLOUD READY ✓"+(user?.username?` · ${user.username}`:"");
		}
		catch(e)
		{
			console.warn("Puter sign-in unavailable",e);
			residualCloudReady=false;
			residualCloudLabel="ENABLE CLOUD ✦";
		}
	}
'''
          if text.count(anchor) != 1:
              raise SystemExit('WebVM state anchor moved; refusing unsafe patch')
          text = text.replace(anchor, anchor + bridge, 1)

          old_write = '''\t\tterm.write(new Uint8Array(buf));'''
          new_write = '''\t\tconst bytes = new Uint8Array(buf);\n\t\tterm.write(bytes);\n\t\tconst out = new TextDecoder().decode(bytes);\n\t\tif(out.includes("RESIDUAL BOOT: guest process attached")) residualVmState = "VM READY · GUEST ATTACHED";\n\t\tresidualBridgeBuffer += out;\n\t\tconst parts = residualBridgeBuffer.split(/\\r?\\n/);\n\t\tresidualBridgeBuffer = parts.pop() || "";\n\t\tfor(const line of parts) residualHandleLine(line.trim());'''
          if text.count(old_write) != 1:
              raise SystemExit('WebVM writeData hook moved; refusing unsafe patch')
          text = text.replace(old_write, new_write, 1)

          old_init = '''\t\ttry\n\t\t{\n\t\t\tawait initCheerpX();\n\t\t}\n\t\tcatch(e)\n\t\t{\n\t\t\tprintMessage(unexpectedErrorMessage);\n\t\t\tprintMessage([e.toString()]);\n\t\t\treturn;\n\t\t}'''
          new_init = '''\t\ttry\n\t\t{\n\t\t\tresidualVmState = window.crossOriginIsolated ? "VM RUNTIME LOADING…" : "VM WAITING FOR ISOLATION RELOAD…";\n\t\t\tawait initCheerpX();\n\t\t}\n\t\tcatch(e)\n\t\t{\n\t\t\tresidualVmState = "VM RUNTIME ERROR · " + e.toString().slice(0,100);\n\t\t\tprintMessage(unexpectedErrorMessage);\n\t\t\tprintMessage([e.toString()]);\n\t\t\treturn;\n\t\t}'''
          if text.count(old_init) != 1:
              raise SystemExit('WebVM init hook moved; refusing unsafe patch')
          text = text.replace(old_init, new_init, 1)

          console_hook = '''\t\tcxReadFunc = cx.setCustomConsole(writeData, term.cols, term.rows);'''
          console_new = '''\t\tcxReadFunc = cx.setCustomConsole(writeData, term.cols, term.rows);\n\t\tresidualVmState = "VM CONSOLE ATTACHED · STARTING GUEST…";'''
          if text.count(console_hook) != 1:
              raise SystemExit('WebVM console hook moved; refusing unsafe patch')
          text = text.replace(console_hook, console_new, 1)

          run_hook = '''\t\t\tawait cx.run(configObj.cmd, configObj.args, configObj.opts);'''
          run_new = '''\t\t\tresidualVmState = "VM GUEST STARTING…";\n\t\t\tawait cx.run(configObj.cmd, configObj.args, configObj.opts);'''
          if text.count(run_hook) != 1:
              raise SystemExit('WebVM run hook moved; refusing unsafe patch')
          text = text.replace(run_hook, run_new, 1)

          main_marker = '<main class="relative w-full h-full">'
          topbar = '''<main class="relative w-full h-full">\n\t<div style="position:fixed;top:0.35rem;left:15rem;right:24rem;z-index:60;display:flex;align-items:center;gap:0.5rem;pointer-events:none;font-family:monospace;font-size:11px;color:#39ff68">\n\t\t<strong style="letter-spacing:.12em">RESIDUAL / LIVE VM</strong>\n\t\t<span style="opacity:.72">{residualVmState}</span>\n\t\t<button on:click={enableResidualCloud} disabled={residualCloudReady} style="pointer-events:auto;margin-left:auto;border:1px solid #39ff68;background:#031006;color:#39ff68;padding:5px 9px;font-family:monospace;font-size:10px;cursor:pointer">{residualCloudLabel}</button>\n\t</div>'''
          if text.count(main_marker) != 1:
              raise SystemExit('WebVM main marker moved; refusing unsafe patch')
          text = text.replace(main_marker, topbar, 1)
          path.write_text(text)
          PY

      - name: Build WebVM client as the top-level demo
        shell: bash
        run: |
          set -euo pipefail
          cd _webvm
          npm install
          WEBVM_MODE=github npm run build
          cd ..
          # WebVM itself is the /demo/ document. This matches the upstream
          # supported GitHub Pages topology and lets its own serviceWorker.js
          # establish cross-origin isolation without an iframe boundary.
          cp -a _webvm/build/. _site/demo/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/demo/index.html')
          text = p.read_text()
          marker = '<head>'
          injection = '<head>\n<meta name="theme-color" content="#000000">\n<script defer src="https://js.puter.com/v2/"></script>'
          if marker not in text:
              raise SystemExit('WebVM built index head marker missing')
          p.write_text(text.replace(marker, injection, 1))
          PY

      - name: Build WebVM index lists
        shell: bash
        run: |
          set -euo pipefail
          find _site/demo -type d | while read -r dir; do rm -f "$dir/index.list"; ls "$dir" | tee "$dir/index.list" >/dev/null; done

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/demo/index.html
          test -s _site/demo/serviceWorker.js
          test -s _site/demo/residual-demo.ext2.meta
          test -s _site/demo.html
          test -s _site/site/demo.html
          test -s _site/walkthrough/index.html
          test -s _site/walkthrough/persist.js
          grep -q "js.puter.com/v2" _site/demo/index.html
          grep -q "RESIDUAL / LIVE VM" _webvm/src/lib/WebVM.svelte
          grep -q "VM READY · GUEST ATTACHED" _webvm/src/lib/WebVM.svelte
          grep -q "browser_bridge" examples/onboarding/cloud_demo.sh
          grep -q "RESIDUAL" _site/index.html
          grep -q "Run failure scenario" _site/walkthrough/index.html
          grep -q "persist.js" _site/walkthrough/index.html
          grep -q "residual.walkthrough.v1" _site/walkthrough/persist.js
          grep -q "residual-demo-shell" _webvm/config_github_terminal.js
          test "$(find _site/demo -name 'residual-demo.ext2.c*.txt' | wc -l)" -gt 0

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
