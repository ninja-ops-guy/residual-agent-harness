name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'index.html'
      - 'demo.html'
      - 'demo/**'
      - 'residual/browser_bridge.py'
      - 'examples/onboarding/cloud_demo.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RESIDUAL
        uses: actions/checkout@v4

      - name: Build static site shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/demo _site/walkthrough _site/vm _site/site
          cp site/index.html _site/index.html
          cp site/live-demo.html _site/demo/index.html
          cp site/demo.html _site/walkthrough/index.html
          cp site/walkthrough-persist.js _site/walkthrough/persist.js
          cp site/coi-serviceworker.js _site/coi-serviceworker.js
          printf '\n<script src="./persist.js"></script>\n' >> _site/walkthrough/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/demo/index.html')
          text = p.read_text()
          marker = '<head>'
          coi = '<head>\n<script>window.coi={coepCredentialless:()=>true,coepDegrade:()=>false};</script>\n<script src="../coi-serviceworker.js"></script>'
          if marker not in text:
              raise SystemExit('live demo head marker missing')
          text = text.replace(marker, coi, 1)
          p.write_text(text)
          PY
          cat > _site/demo.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./demo/"><script>location.replace('./demo/')</script><title>RESIDUAL Live Demo</title><body style="background:#000;color:#39ff68;font:16px monospace">Launching <a style="color:#39ff68" href="./demo/">RESIDUAL live VM</a>…</body>
          EOF
          cat > _site/site/demo.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../demo/"><script>location.replace('../demo/')</script><title>RESIDUAL Live Demo</title><body style="background:#000;color:#39ff68;font:16px monospace">This URL moved. Launching <a style="color:#39ff68" href="../demo/">RESIDUAL live VM</a>…</body>
          EOF
          touch _site/.nojekyll

      - name: Checkout WebVM runtime
        uses: actions/checkout@v4
        with:
          repository: leaningtech/webvm
          ref: main
          path: _webvm

      - name: Prepare minimal RESIDUAL VM image
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='_site' --exclude='_webvm' ./ _webvm/residual-src/
          cp demo/vm/Dockerfile _webvm/dockerfiles/residual_demo
          docker build _webvm --tag residual-webvm-demo --file _webvm/dockerfiles/residual_demo --platform=linux/386

      - name: Export VM filesystem
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker create residual-webvm-demo)"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true; sudo umount /mnt/residual-webvm >/dev/null 2>&1 || true' EXIT
          sudo mkdir -p /mnt/residual-webvm
          sudo fallocate -l 320M residual-demo.ext2
          sudo mkfs.ext2 -q -r 0 residual-demo.ext2
          sudo mount -o loop -t ext2 residual-demo.ext2 /mnt/residual-webvm
          sudo docker cp -a "${CONTAINER_ID}:/" /mnt/residual-webvm/
          sudo test -x /mnt/residual-webvm/bin/bash
          sudo test -x /mnt/residual-webvm/usr/local/bin/residual-demo-shell
          sudo test -f /mnt/residual-webvm/home/residual/.bashrc
          sudo test -f /mnt/residual-webvm/opt/residual/pyproject.toml
          sudo grep -q 'RESIDUAL BOOT: guest process attached' /mnt/residual-webvm/usr/local/bin/residual-demo-shell
          sudo umount /mnt/residual-webvm
          docker rm "$CONTAINER_ID" >/dev/null
          trap - EXIT
          sudo split residual-demo.ext2 _site/vm/residual-demo.ext2.c -a 6 -b 128k -x --additional-suffix=.txt
          stat -c%s residual-demo.ext2 | sudo tee _site/vm/residual-demo.ext2.meta >/dev/null
          sudo chmod -R a+rX _site/vm

      - name: Configure WebVM for RESIDUAL
        shell: bash
        run: |
          set -euo pipefail
          cat > _webvm/config_github_terminal.js <<'EOF'
          export const diskImageUrl = "residual-demo.ext2";
          export const diskImageType = "github";
          export const printIntro = false;
          export const needsDisplay = false;
          export const cmd = "/usr/local/bin/residual-demo-shell";
          export const args = [];
          export const opts = {env:["HOME=/home/residual","TERM=xterm","USER=residual","SHELL=/bin/bash","EDITOR=vi","LANG=C","LC_ALL=C","PYTHONUNBUFFERED=1","RESIDUAL_DEMO_MODEL=gpt-5.6-luna"],cwd:"/opt/residual",uid:1000,gid:1000};
          EOF

      - name: Add browser inference and runtime-state bridge to WebVM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('_webvm/src/lib/WebVM.svelte')
          text = path.read_text()
          old = '''\t\tterm.write(new Uint8Array(buf));'''
          new = '''\t\tconst bytes = new Uint8Array(buf);\n\t\tterm.write(bytes);\n\t\ttry { window.parent.postMessage({type: "residual-vm-output", data: new TextDecoder().decode(bytes)}, window.location.origin); } catch(e) {}'''
          if text.count(old) != 1: raise SystemExit('WebVM writeData hook moved; refusing an unsafe patch')
          text = text.replace(old, new)
          old_init = '''\t\ttry\n\t\t{\n\t\t\tawait initCheerpX();\n\t\t}\n\t\tcatch(e)\n\t\t{\n\t\t\tprintMessage(unexpectedErrorMessage);\n\t\t\tprintMessage([e.toString()]);\n\t\t\treturn;\n\t\t}'''
          new_init = '''\t\ttry\n\t\t{\n\t\t\twindow.parent.postMessage({type: "residual-vm-state", state: "runtime-loading", isolated: window.crossOriginIsolated, sab: typeof SharedArrayBuffer === "function"}, window.location.origin);\n\t\t\tawait initCheerpX();\n\t\t}\n\t\tcatch(e)\n\t\t{\n\t\t\twindow.parent.postMessage({type: "residual-vm-state", state: "runtime-error", error: e.toString(), isolated: window.crossOriginIsolated}, window.location.origin);\n\t\t\tprintMessage(unexpectedErrorMessage);\n\t\t\tprintMessage([e.toString()]);\n\t\t\treturn;\n\t\t}'''
          if text.count(old_init) != 1: raise SystemExit('WebVM init hook moved; refusing an unsafe patch')
          text = text.replace(old_init, new_init)
          console_hook = '''\t\tcxReadFunc = cx.setCustomConsole(writeData, term.cols, term.rows);'''
          console_new = '''\t\tcxReadFunc = cx.setCustomConsole(writeData, term.cols, term.rows);\n\t\twindow.parent.postMessage({type: "residual-vm-state", state: "console-attached", isolated: window.crossOriginIsolated}, window.location.origin);'''
          if text.count(console_hook) != 1: raise SystemExit('WebVM console hook moved; refusing an unsafe patch')
          text = text.replace(console_hook, console_new)
          run_hook = '''\t\t\tawait cx.run(configObj.cmd, configObj.args, configObj.opts);'''
          run_new = '''\t\t\twindow.parent.postMessage({type: "residual-vm-state", state: "guest-starting", isolated: window.crossOriginIsolated}, window.location.origin);\n\t\t\tawait cx.run(configObj.cmd, configObj.args, configObj.opts);'''
          if text.count(run_hook) != 1: raise SystemExit('WebVM run hook moved; refusing an unsafe patch')
          text = text.replace(run_hook, run_new)
          old_mount = '\tonMount(initTerminal);'
          new_mount = '''\tonMount(() => {\n\t\twindow.addEventListener("message", (event) => {\n\t\t\tif(event.source !== window.parent || event.origin !== window.location.origin) return;\n\t\t\tif(event.data?.type !== "residual-vm-input" || typeof event.data.data !== "string") return;\n\t\t\treadData(event.data.data);\n\t\t});\n\t\tinitTerminal();\n\t});'''
          if text.count(old_mount) != 1: raise SystemExit('WebVM mount hook moved; refusing an unsafe patch')
          path.write_text(text.replace(old_mount, new_mount))
          PY

      - name: Build WebVM client
        shell: bash
        run: |
          set -euo pipefail
          cd _webvm
          npm install
          WEBVM_MODE=github npm run build
          cd ..
          cp -a _webvm/build/. _site/vm/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/vm/index.html')
          text = p.read_text()
          marker = '<head>'
          injection = '<head>\n<script>window.coi={coepCredentialless:()=>true,coepDegrade:()=>false};</script>\n<script src="../coi-serviceworker.js"></script>'
          if marker not in text: raise SystemExit('WebVM built index head marker missing')
          p.write_text(text.replace(marker, injection, 1))
          PY
          cat >> _site/demo/index.html <<'EOF'
          <script>
          (()=>{
            const vm=document.getElementById('vm'),status=document.getElementById('status'),loading=document.getElementById('loading');
            let guestOutput=false;
            window.addEventListener('message',event=>{
              if(event.source!==vm.contentWindow||event.origin!==location.origin)return;
              if(event.data?.type==='residual-vm-output' && String(event.data.data||'').length){
                guestOutput=true;loading?.classList.add('hidden');status.textContent='VM READY · GUEST ATTACHED';status.className='';return;
              }
              if(event.data?.type!=='residual-vm-state')return;
              const s=event.data.state;
              if(s==='runtime-loading'){status.textContent=event.data.isolated?'VM RUNTIME LOADING…':'VM BLOCKED · CROSS-ORIGIN ISOLATION MISSING';status.className=event.data.isolated?'fallback':'err';}
              else if(s==='console-attached'){status.textContent='VM CONSOLE ATTACHED · STARTING GUEST…';status.className='fallback';}
              else if(s==='guest-starting'){status.textContent='VM GUEST STARTING…';status.className='fallback';}
              else if(s==='runtime-error'){status.textContent='VM RUNTIME ERROR · '+String(event.data.error||'unknown').slice(0,120);status.className='err';loading?.classList.remove('hidden');}
            });
            setTimeout(()=>{if(!guestOutput&&!window.crossOriginIsolated){status.textContent='VM HOST NOT CROSS-ORIGIN ISOLATED';status.className='err';}},5000);
          })();
          </script>
          EOF

      - name: Build WebVM index lists
        shell: bash
        run: |
          set -euo pipefail
          find _site/vm -type d | while read -r dir; do rm -f "$dir/index.list"; ls "$dir" | tee "$dir/index.list" >/dev/null; done

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/demo/index.html
          test -s _site/demo.html
          test -s _site/site/demo.html
          test -s _site/coi-serviceworker.js
          test -s _site/walkthrough/index.html
          test -s _site/walkthrough/persist.js
          test -s _site/vm/index.html
          test -s _site/vm/residual-demo.ext2.meta
          grep -q "The repository is the demo" _site/demo/index.html
          grep -q "js.puter.com/v2" _site/demo/index.html
          grep -q "coi-serviceworker.js" _site/demo/index.html
          grep -q "coi-serviceworker.js" _site/vm/index.html
          grep -q "residual-vm-state" _webvm/src/lib/WebVM.svelte
          grep -q "../demo/" _site/site/demo.html
          grep -q "residual-vm-output" _webvm/src/lib/WebVM.svelte
          grep -q "browser_bridge" examples/onboarding/cloud_demo.sh
          grep -q "RESIDUAL" _site/index.html
          grep -q "Run failure scenario" _site/walkthrough/index.html
          grep -q "persist.js" _site/walkthrough/index.html
          grep -q "residual.walkthrough.v1" _site/walkthrough/persist.js
          grep -q "residual-demo-shell" _webvm/config_github_terminal.js
          test "$(find _site/vm -name 'residual-demo.ext2.c*.txt' | wc -l)" -gt 0

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
