name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'index.html'
      - 'demo.html'
      - 'demo/**'
      - 'residual/**'
      - 'pyproject.toml'
      - 'tests/test_webvm_*.py'
      - 'tests/webvm-provider.test.mjs'
      - 'examples/onboarding/cloud_demo.sh'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'demo/**'
      - 'residual/**'
      - 'pyproject.toml'
      - 'tests/test_webvm_*.py'
      - 'tests/webvm-provider.test.mjs'
      - 'examples/onboarding/cloud_demo.sh'
      - 'tests/test_webvm_publication.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build-and-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages-artifact-name: ${{ steps.pages-artifact.outputs.name }}
    steps:
      - name: Checkout RESIDUAL
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record attempt-specific Pages artifact name
        id: pages-artifact
        shell: bash
        run: |
          printf 'name=github-pages-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test provider session contracts
        run: node --experimental-default-type=module --test tests/webvm-provider.test.mjs
      - name: Test publication contracts
        run: python -m unittest -v tests.test_webvm_publication tests.test_webvm_cli_output tests.test_webvm_deployment_workflow tests.test_webvm_workbench
      - name: Build static site shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/demo _site/walkthrough _site/vm _site/site
          cp site/index.html _site/index.html
          cp site/demo.html _site/walkthrough/index.html
          cp site/walkthrough-persist.js _site/walkthrough/persist.js
          printf '\n<script src="./persist.js"></script>\n' >> _site/walkthrough/index.html
          cat > _site/demo.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./demo/"><title>RESIDUAL Live Demo</title><body style="background:#000;color:#39ff68;font:16px monospace"><a style="color:#39ff68" href="./demo/">Open RESIDUAL live VM</a></body>
          EOF
          cat > _site/site/demo.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../demo/"><title>RESIDUAL Live Demo</title><body style="background:#000;color:#39ff68;font:16px monospace"><a style="color:#39ff68" href="../demo/">Open RESIDUAL live VM</a></body>
          EOF
          cp _site/site/demo.html _site/vm/index.html
          touch _site/.nojekyll
      - name: Checkout pinned WebVM runtime
        uses: actions/checkout@v4
        with:
          repository: leaningtech/webvm
          ref: 388d0adeb319d9ad605a5ec0485777cff5430c88
          path: _webvm
      - name: Prepare minimal RESIDUAL VM image
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git' --exclude='_site' --exclude='_webvm' ./ _webvm/residual-src/
          cp demo/vm/Dockerfile _webvm/dockerfiles/residual_demo
          docker build _webvm --tag residual-webvm-demo --file _webvm/dockerfiles/residual_demo --platform=linux/386
      - name: Export VM filesystem with immutable image identity
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID="$(docker create residual-webvm-demo)"
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true; sudo umount /mnt/residual-webvm >/dev/null 2>&1 || true' EXIT
          sudo mkdir -p /mnt/residual-webvm
          sudo fallocate -l 320M residual-demo.ext2
          sudo mkfs.ext2 -q -r 0 residual-demo.ext2
          sudo mount -o loop -t ext2 residual-demo.ext2 /mnt/residual-webvm
          sudo docker cp -a "${CONTAINER_ID}:/" /mnt/residual-webvm/
          sudo test -x /mnt/residual-webvm/bin/bash
          sudo test -x /mnt/residual-webvm/usr/local/bin/residual-demo-shell
          sudo test -f /mnt/residual-webvm/home/residual/.bashrc
          sudo test -d /mnt/residual-webvm/home/user/documents
          sudo test -f /mnt/residual-webvm/opt/residual/pyproject.toml
          sudo grep -q 'RESIDUAL BOOT: guest process attached' /mnt/residual-webvm/usr/local/bin/residual-demo-shell
          sudo umount /mnt/residual-webvm
          docker rm "$CONTAINER_ID" >/dev/null
          trap - EXIT
          IMAGE_SHA="$(sha256sum residual-demo.ext2 | cut -d' ' -f1)"
          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"
          sudo split residual-demo.ext2 "_site/demo/residual-demo-${IMAGE_SHA}.ext2.c" -a 6 -b 128k -x --additional-suffix=.txt
          stat -c%s residual-demo.ext2 | sudo tee "_site/demo/residual-demo-${IMAGE_SHA}.ext2.meta" >/dev/null
          sudo chmod -R a+rX _site/demo
      - name: Configure WebVM for RESIDUAL
        shell: bash
        run: |
          set -euo pipefail
          cat > _webvm/config_github_terminal.js <<EOF
          export const diskImageUrl = "residual-demo-${IMAGE_SHA}.ext2";
          export const residualCacheId = "residual-${IMAGE_SHA}";
          export const diskImageType = "github";
          export const printIntro = false;
          export const needsDisplay = false;
          export const cmd = "/usr/local/bin/residual-demo-shell";
          export const args = [];
          export const opts = {env:["HOME=/home/residual","TERM=xterm","USER=residual","SHELL=/bin/bash","EDITOR=vi","LANG=C","LC_ALL=C","PYTHONUNBUFFERED=1","RESIDUAL_DEMO_MODEL=gpt-5.6-luna"],cwd:"/opt/residual",uid:1000,gid:1000};
          EOF
      - name: Patch WebVM for RESIDUAL
        run: |
          python demo/vm/patch_webvm.py source _webvm/src/lib/WebVM.svelte
          python demo/vm/qualify_webvm.py _webvm/src/lib/WebVM.svelte
          python demo/vm/install_workbench.py _webvm/src/lib/WebVM.svelte _site
          python demo/vm/patch_webvm.py app _webvm/src/app.html
      - name: Build WebVM client as top-level demo
        shell: bash
        run: |
          set -euo pipefail
          cd _webvm
          npm install
          WEBVM_MODE=github npm run build
          cd ..
          cp -a _webvm/build/. _site/demo/
          python demo/vm/patch_webvm.py index _site/demo/index.html
          python demo/vm/patch_webvm.py serviceworker _site/demo/serviceWorker.js
          python demo/vm/pages_contract.py --demo-dir _site/demo --commit "$GITHUB_SHA" --webvm-commit "$(git -C _webvm rev-parse HEAD)" --disk residual-demo.ext2
      - name: Build WebVM index lists
        shell: bash
        run: |
          set -euo pipefail
          find _site/demo -type d | while read -r dir; do
            rm -f "$dir/index.list"
            ls "$dir" | tee "$dir/index.list" >/dev/null
          done
      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/demo/index.html
          test -s _site/demo/serviceWorker.js
          test -s "_site/demo/residual-demo-${IMAGE_SHA}.ext2.meta"
          test -s _site/demo/build-info.json
          test -s _site/provider/index.html
          test -s _site/provider/provider.js
          test -s _site/demo.html
          test -s _site/site/demo.html
          test -s _site/walkthrough/index.html
          test -s _site/walkthrough/persist.js
          ! grep -q 'js.puter.com/v2' _site/demo/index.html
          ! grep -q 'plausible.leaningtech.com' _site/demo/index.html
          grep -q 'return Response.error()' _site/demo/serviceWorker.js
          grep -q 'residualLoadPuterSdk' _webvm/src/lib/WebVM.svelte
          grep -q 'VM READY · GUEST ATTACHED' _webvm/src/lib/WebVM.svelte
          grep -q 'browser_bridge' examples/onboarding/cloud_demo.sh
          grep -q 'Run failure scenario' _site/walkthrough/index.html
          grep -q 'residual.walkthrough.v1' _site/walkthrough/persist.js
          test "$(find _site/demo -name 'residual-demo-*.ext2.c*.txt' | wc -l)" -gt 0
      - name: Install real browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Prove actual generated artifact in desktop and narrow browsers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-evidence preview
          ln -s "$PWD/_site" "preview/${GITHUB_REPOSITORY#*/}"
          python -m http.server 8765 --bind 127.0.0.1 --directory preview > browser-evidence/http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 0.2; done
          URL="http://127.0.0.1:8765/${GITHUB_REPOSITORY#*/}/demo/"
          python demo/vm/browser_smoke.py --url "$URL" --expected-sha "$GITHUB_SHA" --output browser-evidence/desktop
          python demo/vm/browser_smoke.py --url "$URL" --expected-sha "$GITHUB_SHA" --output browser-evidence/narrow --mobile
      - name: Retain browser proof and build identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webvm-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            browser-evidence/
            _site/demo/build-info.json
            _webvm/package-lock.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload only browser-qualified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ steps.pages-artifact.outputs.name }}
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-browser-proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require GitHub Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > pages-config.json
          python demo/vm/pages_contract.py --pages-config pages-config.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Consume the build job's actual artifact, including on deploy-only retries.
          artifact_name: ${{ needs.build-and-browser-proof.outputs.pages-artifact-name }}
      - name: Install browser for live acceptance
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify published WebVM revision and real guest execution
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python demo/vm/browser_smoke.py --url "${PAGE_URL%/}/demo/" --expected-sha "$GITHUB_SHA" --output live-browser-evidence/desktop
      - name: Verify published WebVM on narrow Chromium viewport
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python demo/vm/browser_smoke.py --url "${PAGE_URL%/}/demo/" --expected-sha "$GITHUB_SHA" --output live-browser-evidence/narrow --mobile
      - name: Retain live acceptance proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webvm-live-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-browser-evidence/
            pages-config.json
          retention-days: 7
          if-no-files-found: warn
