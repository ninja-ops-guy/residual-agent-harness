name: RESIDUAL live provider qualification

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider adapter to qualify
        required: true
        type: choice
        options: [openai, openai_compatible, anthropic, google, ollama]
        default: openai
      model:
        description: Exact model identifier
        required: true
        type: string
      base_url:
        description: Optional provider base URL; required for openai_compatible
        required: false
        type: string
      require_usage:
        description: Fail unless positive token usage is returned
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  provider-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependencies
        run: python -m pip install '.[factory,qualification]'
      - name: Execute bounded live provider canary
        id: live
        continue-on-error: true
        env:
          RESIDUAL_QUALIFICATION_LLM_API_KEY: ${{ secrets.RESIDUAL_QUALIFICATION_LLM_API_KEY }}
          QUAL_PROVIDER: ${{ inputs.provider }}
          QUAL_MODEL: ${{ inputs.model }}
          QUAL_BASE_URL: ${{ inputs.base_url }}
          QUAL_REQUIRE_USAGE: ${{ inputs.require_usage }}
        shell: bash
        run: |
          mkdir -p runs/provider-qualification
          args=(
            --provider "$QUAL_PROVIDER"
            --model "$QUAL_MODEL"
            --output runs/provider-qualification/provider-report.json
          )
          if [ -n "$QUAL_BASE_URL" ]; then
            args+=(--base-url "$QUAL_BASE_URL")
          fi
          if [ "$QUAL_REQUIRE_USAGE" = 'false' ]; then
            args+=(--no-require-usage)
          fi
          python scripts/qualification_provider_canary.py "${args[@]}"
      - name: Bind live result without collapsing UNKNOWN into FAIL
        id: envelope
        continue-on-error: true
        run: |
          python scripts/qualification_envelope_from_report.py \
            --gate-id live-provider-canary \
            --report runs/provider-qualification/provider-report.json \
            --output runs/provider-qualification/provider.evidence.json \
            --non-claim 'One bounded live request is transport/evidence qualification, not a model-quality or production-readiness result.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-qualification-${{ inputs.provider }}-${{ github.sha }}-${{ github.run_id }}
          path: runs/provider-qualification
          if-no-files-found: error
          retention-days: 90
      - name: Enforce final provider qualification result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runs/provider-qualification/provider-report.json')
          if not p.exists(): raise SystemExit('provider report missing')
          result=json.loads(p.read_text())['result']
          if result != 'PASS': raise SystemExit(f'live provider qualification={result}')
          PY
