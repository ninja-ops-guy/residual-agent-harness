name: Clean install qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run clean-install qualification (fail-closed)
        run: |
          set -o pipefail
          mkdir -p runs/clean-install
          python verifier/v3/qualify_clean_install.py \
            --source-root "$GITHUB_WORKSPACE" \
            --output "$GITHUB_WORKSPACE/runs/clean-install/report.json" \
            2>&1 | tee runs/clean-install/qualification.txt
      - name: Regression-test the qualification tooling
        run: |
          python -m pip install '.[test]'
          python -m pytest tests/test_clean_install_qualification.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: clean-install-python-${{ matrix.python-version }}-${{ github.sha }}
          path: runs/clean-install
          if-no-files-found: error
          retention-days: 14
