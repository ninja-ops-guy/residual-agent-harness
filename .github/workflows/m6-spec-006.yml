name: M6-SPEC-006 corrected-runtime validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m6-spec-006:
    if: github.head_ref == 'experiment/m6-spec-006-runtime-corrected'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11437
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5-coder:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Verify remediation regressions
        run: |
          python -m unittest \
            tests.station.test_station.StationTests.test_repair_attempt_receives_previous_candidate_without_mutating_fresh_baseline \
            tests.station.test_station.StationTests.test_batch_can_repair_on_fourth_attempt_without_weakening_checks -v
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-m6-006.log 2>&1 &
          echo $! > /tmp/ollama-m6-006.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11437/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6-006.log
          exit 1
      - name: Pull frozen model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          cat /tmp/ollama-m6-006.pid
          ollama --version
          ollama list | tee /tmp/ollama-models-m6-006.txt
          curl -fsS http://127.0.0.1:11437/api/tags > /tmp/ollama-tags-m6-006.json
      - name: Execute authoritative M6-SPEC-006 trial
        run: python scripts/m6_improvementspec_experiment.py --model "$OLLAMA_MODEL" --base-url http://127.0.0.1:11437 --output runs/m6-spec-006/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-spec-006/evidence.json || cat runs/m6-spec-006/evidence.json
          echo "--- ollama log ---"
          tail -300 /tmp/ollama-m6-006.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-spec-006-corrected-runtime-evidence
          path: |
            runs/m6-spec-006
            /tmp/ollama-m6-006.log
            /tmp/ollama-m6-006.pid
            /tmp/ollama-models-m6-006.txt
            /tmp/ollama-tags-m6-006.json
