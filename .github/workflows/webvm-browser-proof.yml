name: WebVM browser proof

on:
  pull_request:
    paths:
      - 'demo/vm/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/webvm-browser-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise live top-level WebVM and real guest commands
        run: >-
          python demo/vm/browser_smoke.py
          --url https://ninja-ops-guy.github.io/residual-agent-harness/demo/
          --output browser-evidence/live-chromium
      - name: Retain browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webvm-browser-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-evidence/
          retention-days: 7
          if-no-files-found: warn
