name: M4 qualification runner prerequisites

on:
  pull_request:
    paths:
      - "residual/factory/m4_sandbox.py"
      - "residual/factory/m4_qualification_prereq.py"
      - "residual/factory/_isolated_child.py"
      - "tests/test_factory_m4*.py"
      - ".github/workflows/m4-qualification-prereq.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m4-prereq:
    # Explicit qualification target; image identity is retained below.
    # Migrate before ubuntu-22.04 retirement on 2027-04-17.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[factory]" pytest
      - name: Retain source and environment identity
        env:
          SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p runs/m4-qualification-prereq
          python -m pip freeze > runs/m4-qualification-prereq/dependencies.txt
          python - <<'PYIDENTITY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          dirty = git('status', '--porcelain', '--untracked-files=no')
          identity = {
              'commit': git('rev-parse', 'HEAD'),
              'tree': git('rev-parse', 'HEAD^{tree}'),
              'tracked_source_dirty': bool(dirty),
              'python': sys.version,
              'platform': platform.platform(),
              'runner': {k: os.environ.get(k) for k in (
                  'ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH',
                  'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'SOURCE_PR_HEAD', 'SOURCE_BASE')},
          }
          Path('runs/m4-qualification-prereq/source-environment.json').write_text(
              json.dumps(identity, indent=2) + '\n')
          assert not dirty, 'Tracked source changed before qualification'
          PYIDENTITY
      - name: Capability probes + environment manifest (fail closed)
        run: |
          set -o pipefail
          mkdir -p runs/m4-qualification-prereq
          python -m residual.factory.m4_qualification_prereq \
            --output runs/m4-qualification-prereq/report.json \
            --revision "${{ github.sha }}" 2>&1 | tee runs/m4-qualification-prereq/probe.log
      - name: M4 tests (zero skips required to qualify)
        run: |
          set -o pipefail
          python -m pytest tests/test_factory_m4*.py \
            tests/test_sandbox_timing_determinism.py::IsolatedTimeoutTypingTests -v \
            --junitxml=runs/m4-qualification-prereq/m4-sandbox.xml \
            2>&1 | tee runs/m4-qualification-prereq/tests.log
          python - <<'PYQUAL'
          import xml.etree.ElementTree as ET
          root = ET.parse("runs/m4-qualification-prereq/m4-sandbox.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases, "No M4 sandbox test cases were executed"
          assert not any(c.find("skipped") is not None for c in cases), \
              "Skipped M4 tests cannot qualify the boundary"
          PYQUAL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m4-qualification-prereq-${{ github.sha }}
          path: runs/m4-qualification-prereq
          if-no-files-found: error
          retention-days: 14
