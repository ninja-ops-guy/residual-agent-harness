name: OpenClaw control software component (not release qualification)
on:
  pull_request:
    paths:
      - 'integrations/openclaw-control/**'
      - 'residual/station/contracts.py'
      - 'residual/station/service.py'
      - 'residual/station/server.py'
      - 'tests/station/test_station.py'
      - '.github/workflows/openclaw-control-software.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16.0', '24.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Record checked-out identity (may be synthetic PR merge)
        run: |
          mkdir -p "$RUNNER_TEMP/oc-source"
          git rev-parse HEAD > "$RUNNER_TEMP/oc-source/checked-out-head.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/oc-source/checked-out-tree.txt"
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/oc-source/pr-head.txt"
      - name: Dependency-free software qualification
        working-directory: integrations/openclaw-control
        run: node qualify.mjs --output "$RUNNER_TEMP/oc-software"
      - name: Package without installation hooks or credentials
        working-directory: integrations/openclaw-control
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/oc-software"
      - name: Preserve software evidence, not a live qualification claim
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openclaw-software-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/oc-software/
            ${{ runner.temp }}/oc-source/
          if-no-files-found: error

  station-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install .
      - name: Station remote-worker authority regression
        run: python -m unittest discover -s tests/station -p 'test_station.py' -v
