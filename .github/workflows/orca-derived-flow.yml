name: Orca-derived flow integration

on:
  push:
    branches:
      - feature/orca-derived-flow-runtime
  pull_request:
    paths:
      - 'residual/orchestrator/**'
      - 'tests/test_orca_derived_flow.py'
      - 'tests/test_orca_flow_benchmark.py'
      - 'scripts/orca_flow_smoke.py'
      - 'scripts/orca_flow_benchmark.py'
      - 'docs/specs/orca-derived-flow-runtime.md'
      - '.github/workflows/orca-derived-flow.yml'

permissions:
  contents: read

jobs:
  integration-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q residual
      - name: Focused integration and benchmark-contract tests
        run: >-
          python -m pytest -q
          tests/test_orca_derived_flow.py
          tests/test_orca_flow_benchmark.py
          tests/test_orchestrator_plan.py
      - name: Credential-free smoke
        run: python scripts/orca_flow_smoke.py
      - name: Development performance benchmark
        if: matrix.python == '3.13'
        run: >-
          python scripts/orca_flow_benchmark.py
          --iterations 500
          --output runs/orca-flow-benchmark.json
      - name: Preserve benchmark evidence
        if: matrix.python == '3.13' && always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-flow-benchmark-python-3.13
          path: runs/orca-flow-benchmark.json
          if-no-files-found: ignore
          retention-days: 14
