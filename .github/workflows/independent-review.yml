name: Independent review gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  independent-review:
    name: independent-review
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test review policy logic
        run: python -m unittest discover -s tests -p 'test_independent_review_gate.py' -q
      - name: Require independent current-head approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_independent_review.py
