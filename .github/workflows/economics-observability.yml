name: Economics and observability qualification

on:
  pull_request:
    paths:
      - residual/assurance/orchestration.py
      - residual/observability/**
      - residual/eval_frozen/**
      - scripts/swarm5_evidence.py
      - tests/swarm/test_economics*.py
      - .github/workflows/economics-observability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economics-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[factory]' pytest
      - name: Require compatibility and integrity regressions
        run: |
          set -o pipefail
          mkdir -p runs/economics-qualification
          python -m pytest tests/swarm/test_economics_integrity.py tests/swarm/test_economics_observability.py tests/swarm/test_obs006.py tests/swarm/test_otx.py tests/swarm/test_eval_frozen.py tests/test_eval_frozen_acceptance_binding.py -ra --junitxml=runs/economics-qualification/tests.xml 2>&1 | tee runs/economics-qualification/tests.log
      - name: Reproduce development evidence at the actual source identity
        run: |
          python scripts/swarm5_evidence.py --output runs/economics-qualification/first
          python scripts/swarm5_evidence.py --output runs/economics-qualification/repeated
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('runs/economics-qualification')
          first, repeated = root / 'first', root / 'repeated'
          assert {p.name for p in first.iterdir()} == {p.name for p in repeated.iterdir()}
          for path in first.iterdir():
              assert path.read_bytes() == (repeated / path.name).read_bytes(), path.name
          evidence = json.loads((first / 'evidence.json').read_text())
          assert evidence['commit_sha'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert evidence['tree_sha'] == subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          assert evidence['evidence_level'] == 'development_fixture'
          assert evidence['aggregate_report']['overall']['throughput_runs_per_sec'] is None
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economics-qualification-${{ github.sha }}
          path: runs/economics-qualification/
          if-no-files-found: error
