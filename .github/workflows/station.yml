name: Command Station checks
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: command-station-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  # Superseded PR-head runs are disposable. Main qualification is never
  # cancelled by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  windows-ownership:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project qualification dependencies
        run: python -m pip install -e '.[factory,qualification]' pytest
      - name: Native Windows ownership qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runs/windows-ownership | Out-Null
          python scripts/qualification_v1.py run `
            --gate-id windows-c01-c02 `
            --output runs/windows-ownership/evidence.json `
            --log runs/windows-ownership/qualification.log `
            --junit runs/windows-ownership/qualification.xml `
            --zero-skips `
            -- python -m pytest tests/station/test_windows_ownership_qualification.py -vv -s `
               --junitxml=runs/windows-ownership/qualification.xml
      - name: Complete applicable Station suite
        run: >-
          python -m pytest tests/station -q
          --junitxml=runs/windows-ownership/station.xml
      - name: Sensitivity — second owner mutation must be detected
        shell: pwsh
        run: |
          $path = 'residual/station/ownership.py'
          $source = [IO.File]::ReadAllText($path)
          $mutant = $source.Replace(
            'error = ctypes.get_last_error()',
            'error = 0  # deliberate CI sensitivity mutation')
          if ($mutant -eq $source) { throw 'second-owner mutation point not found' }
          [IO.File]::WriteAllText($path, $mutant)
          python -m pytest `
            tests/station/test_windows_ownership_qualification.py::NativeWindowsOwnershipQualification::test_w02_twenty_round_four_process_race_has_exactly_one_owner `
            -vv 2>&1 | Tee-Object runs/windows-ownership/sensitivity-second-owner.log
          $detected = $LASTEXITCODE -ne 0
          git restore -- $path
          if (-not $detected) { throw 'qualification missed second-owner mutation' }
      - name: Sensitivity — early release mutation must be detected
        shell: pwsh
        run: |
          $path = 'residual/station/ownership.py'
          $source = [IO.File]::ReadAllText($path)
          $needle = '            self._state = "CLOSING"'
          $replacement = $needle + "`r`n            self.ownership.close()  # deliberate CI sensitivity mutation"
          $mutant = $source.Replace($needle, $replacement)
          if ($mutant -eq $source) { throw 'early-release mutation point not found' }
          [IO.File]::WriteAllText($path, $mutant)
          python -m pytest `
            tests/station/test_windows_ownership_qualification.py::NativeWindowsOwnershipQualification::test_w05_closing_reservation_retains_owner `
            -vv 2>&1 | Tee-Object runs/windows-ownership/sensitivity-early-release.log
          $detected = $LASTEXITCODE -ne 0
          git restore -- $path
          if (-not $detected) { throw 'qualification missed early-release mutation' }
      - name: Verify deliberate mutations were restored
        run: git diff --exit-code -- residual/station/ownership.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-station-ownership-${{ github.sha }}
          path: runs/windows-ownership
          if-no-files-found: error
          retention-days: 30
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project test dependencies
        run: python -m pip install -e '.[factory,qualification]' pytest
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps -w dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ui && npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-browser-evidence
          path: runs/browser
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - name: Prove the documented default Docker startup path
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --build -d
          cleanup() {
            docker compose logs --no-color > docker-startup.log 2>&1 || true
            docker compose down -v >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:8765/api/bootstrap > docker-bootstrap.json; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" -eq 1
          python - <<'PY'
          import json
          value = json.load(open("docker-bootstrap.json", encoding="utf-8"))
          assert value["version"] == "0.3.0"
          PY

          # The browser-facing port is a container TCP forwarder. The Station
          # process itself must remain on loopback so the C01/C02 exposure guard
          # is not bypassed merely to make Docker port publishing work.
          docker compose exec -T station python3 - <<'PY'
          import pathlib, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8766/api/bootstrap", timeout=3) as response:
              assert response.status == 200
          commands = []
          for path in pathlib.Path("/proc").glob("[0-9]*/cmdline"):
              try:
                  value = path.read_bytes().replace(b"\0", b" ").decode("utf-8", "replace")
              except OSError:
                  continue
              if "residual.station.server" in value:
                  commands.append(value)
          assert len(commands) == 1, commands
          command = commands[0]
          assert "--host 127.0.0.1" in command, command
          assert "--port 8766" in command, command
          assert "--host 0.0.0.0" not in command, command
          print(command)
          PY
      - name: Exercise Station service logic in the built image
        run: >-
          docker run --rm --entrypoint python3 residual-command-station:0.2.0
          -c "from residual.station.service import Station,demo_spec; import tempfile; s=Station(tempfile.mkdtemp()); p=s.create(demo_spec(),demo=True)['project_id']; assert s.batch(p)['integrated']==3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-default-startup-${{ github.sha }}
          path: |
            docker-startup.log
            docker-bootstrap.json
          if-no-files-found: warn
