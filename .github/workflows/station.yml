name: Command Station checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project test dependencies
        run: python -m pip install -e '.[factory]' pytest
      - name: Test once with retained termination diagnostics
        env:
          QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALIFICATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          mkdir -p runs/station-unittest
          python scripts/qualification_test_runner.py --output runs/station-unittest/events.jsonl 2>&1 | tee runs/station-unittest/tests.txt
      - name: Preserve ordinary-suite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-unittest-${{ github.run_id }}-${{ github.run_attempt }}-python-${{ matrix.python }}
          path: runs/station-unittest/
          if-no-files-found: error
          retention-days: 14
      - run: python -m pip wheel . --no-deps -w dist
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ui && npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-browser-evidence
          path: runs/browser
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t residual-station-ci .
      - run: docker run --rm --entrypoint python3 residual-station-ci -c "from residual.station.service import Station,demo_spec; import tempfile; s=Station(tempfile.mkdtemp()); p=s.create(demo_spec(),demo=True)['project_id']; assert s.batch(p)['integrated']==3"
