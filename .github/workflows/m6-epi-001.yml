name: M6-EPI-001 evidence sufficiency fork
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m6-epi-001:
    if: github.head_ref == 'experiment/m6-epi-001-measurement-gap'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11439
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5-coder:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-m6-epi-001.log 2>&1 &
          echo $! > /tmp/ollama-m6-epi-001.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11439/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6-epi-001.log
          exit 1
      - name: Pull coding model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          ollama --version
          ollama list | tee /tmp/ollama-models-m6-epi-001.txt
      - name: Execute authoritative epistemic fork
        run: python scripts/m6_epi_001.py --model "$OLLAMA_MODEL" --base-url http://127.0.0.1:11439 --output runs/m6-epi-001/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-epi-001/evidence.json || cat runs/m6-epi-001/evidence.json
          tail -300 /tmp/ollama-m6-epi-001.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-epi-001-evidence
          path: |
            runs/m6-epi-001
            /tmp/ollama-m6-epi-001.log
            /tmp/ollama-m6-epi-001.pid
            /tmp/ollama-models-m6-epi-001.txt
