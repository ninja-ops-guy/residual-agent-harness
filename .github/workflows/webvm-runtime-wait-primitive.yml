name: WebVM alternate wait primitive discriminator

on:
  pull_request:
    paths:
      - 'demo/vm/runtime_wait_primitive.py'
      - '.github/workflows/webvm-runtime-wait-primitive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wait-primitive-live-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Resolve exact published main revision
        id: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Compare Python sleep with stdlib select timeout
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          python demo/vm/runtime_wait_primitive.py \
            --url "https://ninja-ops-guy.github.io/residual-agent-harness/demo/" \
            --expected-sha "$MAIN_SHA" \
            --output runtime-wait-primitive \
            --sleep-seconds 0.05 \
            --control-iterations 300 \
            --candidate-iterations 400
      - name: Retain wait-primitive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webvm-runtime-wait-primitive-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-wait-primitive/
          retention-days: 14
          if-no-files-found: warn

  native-i386-wait-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run equivalent waits outside WebVM
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/386 i386/debian:bookworm-slim sh -lc '
            apt-get update >/dev/null && apt-get install -y --no-install-recommends python3 >/dev/null &&
            python3 - <<"PY"
          import select, time
          for count in range(1, 401):
              time.sleep(0.05)
          print("NATIVE_I386_TIME_SLEEP_PASS", count)
          for count in range(1, 401):
              ready = select.select([], [], [], 0.05)
              assert ready == ([], [], [])
          print("NATIVE_I386_SELECT_EMPTY_PASS", count)
          PY
          ' | tee native-i386-wait-controls.txt
      - name: Retain native control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-i386-wait-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-i386-wait-controls.txt
          retention-days: 14
          if-no-files-found: error
