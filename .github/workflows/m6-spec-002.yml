name: M6-SPEC-002 stronger-model replication
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m6-spec-002:
    if: github.head_ref == 'experiment/m6-spec-002-model-capability'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Ensure intended Ollama server
        run: |
          pkill -f "ollama serve" || true
          sleep 1
          nohup ollama serve > /tmp/ollama-m6-002.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6-002.log
          exit 1
      - name: Pull preregistered model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record model inventory
        run: ollama list | tee /tmp/ollama-models-m6-002.txt
      - name: Execute authoritative M6-SPEC-002 trial
        run: python scripts/m6_improvementspec_experiment.py --model "$OLLAMA_MODEL" --output runs/m6-improvementspec/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-improvementspec/evidence.json || cat runs/m6-improvementspec/evidence.json
          tail -200 /tmp/ollama-m6-002.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-spec-002-research-evidence
          path: |
            runs/m6-improvementspec
            /tmp/ollama-m6-002.log
            /tmp/ollama-models-m6-002.txt
