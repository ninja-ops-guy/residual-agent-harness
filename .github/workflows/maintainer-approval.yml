# STAGED WORKFLOW — MAINTAINER ACTION REQUIRED (#268)
#
# The automation token used to author this change lacks the `workflow` scope,
# so this file cannot be pushed under `.github/workflows/`. A maintainer with
# the workflow scope must move this file to:
#
#   .github/workflows/maintainer-approval.yml
#
# replacing the existing file verbatim, then delete this staging copy.
# Until that move lands, the required `maintainer-approval` status is still
# published only by the old event wiring and issue #268 remains open.
#
# Changes vs. the current workflow:
#   1. Adds `statuses: write` so the job may publish a commit status.
#   2. The evaluation step now runs with `--publish-status`, so the gate
#      result is published as the protected `maintainer-approval` commit
#      status on the EXACT CURRENT PR head SHA (fetched live from the API by
#      scripts/check_maintainer_approval.py), not merely on the
#      default-branch event SHA of the issue_comment run.
#   3. A trailing `if: always()` re-publication guard is intentionally NOT
#      needed: a single step publishes success/failure and exits with the
#      gate's code, so pull_request runs still fail the PR-head check suite
#      while issue_comment runs still fix the head status. Fail-closed is
#      preserved: BLOCKED exits 2 before any status is published.
name: Maintainer approval gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  maintainer-approval:
    name: maintainer-approval
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit-test maintainer approval policy
        run: python -m unittest discover -s tests -p 'test_maintainer_approval*.py' -q
      - name: Require explicit exact-head maintainer approval and publish it on the PR head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/check_maintainer_approval.py --publish-status
