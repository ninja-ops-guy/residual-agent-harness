name: RESIDUAL Qualification v1

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install qualification dependencies
        run: python -m pip install '.[factory,qualification]'
      - name: Full deterministic regression gate
        run: |
          mkdir -p runs/qualification-v1
          python scripts/qualification_v1.py run \
            --gate-id deterministic-regression \
            --output runs/qualification-v1/deterministic.evidence.json \
            --log runs/qualification-v1/deterministic.log \
            --junit runs/qualification-v1/deterministic.xml \
            --non-claim 'General regression capability skips are retained; security boundaries have separate zero-skip gates.' \
            -- python -m pytest tests --ignore=tests/qualification -q \
               --junitxml=runs/qualification-v1/deterministic.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-deterministic-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discovery dependencies
        run: python -m pip install '.[factory,qualification]'
      - name: Stateful lifecycle qualification
        continue-on-error: true
        run: |
          mkdir -p runs/qualification-v1
          python scripts/qualification_v1.py run \
            --gate-id stateful-runtime-journal \
            --output runs/qualification-v1/stateful.evidence.json \
            --log runs/qualification-v1/stateful.log \
            --junit runs/qualification-v1/stateful.xml \
            --zero-skips \
            -- python -m pytest tests/qualification/test_stateful_runtime_journal.py -q \
               --junitxml=runs/qualification-v1/stateful.xml
      - name: Deterministic distributed history exploration
        continue-on-error: true
        run: |
          python scripts/qualification_v1.py history \
            --gate-id distributed-history \
            --seeds 60 --steps 120 --lanes 3 \
            --output runs/qualification-v1/history.evidence.json \
            --report runs/qualification-v1/history-report.json
      - name: Trust-boundary mutation canary
        continue-on-error: true
        run: |
          python scripts/qualification_v1.py run \
            --gate-id mutation-canary \
            --output runs/qualification-v1/mutation.evidence.json \
            --log runs/qualification-v1/mutation.log \
            --evidence-path runs/qualification-v1/mutation-report.json \
            -- python scripts/qualification_mutation_canary.py \
               --output runs/qualification-v1/mutation-report.json
      - name: Branch-coverage strength gate
        continue-on-error: true
        run: |
          python scripts/qualification_v1.py run \
            --gate-id coverage-strength \
            --output runs/qualification-v1/coverage.evidence.json \
            --log runs/qualification-v1/coverage.log \
            --evidence-path runs/qualification-v1/coverage.json \
            -- bash -lc "coverage erase && \
              coverage run --branch -m pytest -q \
                tests/qualification/test_evidence_manifest.py \
                tests/qualification/test_trust_boundary_canaries.py \
                tests/qualification/test_paired_stats.py \
                tests/test_factory_worker_contract.py \
                tests/test_factory_runtime.py && \
              coverage json -o runs/qualification-v1/coverage.json && \
              coverage report --include='residual/qualification/*,residual/factory/runtime_journal.py,residual/factory/worker_contract.py,residual/eval/stats.py' --fail-under=55"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-discovery-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  m4:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M4 qualification dependencies
        run: python -m pip install '.[factory,qualification]'
      - name: M4 host capability gate
        run: |
          mkdir -p runs/qualification-v1
          python scripts/qualification_v1.py run \
            --gate-id m4-capability \
            --output runs/qualification-v1/m4-capability.evidence.json \
            --log runs/qualification-v1/m4-capability.log \
            --evidence-path runs/qualification-v1/m4-capability-report.json \
            -- python -m residual.factory.m4_qualification_prereq \
               --output runs/qualification-v1/m4-capability-report.json \
               --revision "$GITHUB_SHA"
      - name: M4 zero-skip trust-boundary gate
        env:
          RESIDUAL_REQUIRE_SECCOMP: '1'
        run: |
          python scripts/qualification_v1.py run \
            --gate-id m4-zero-skip \
            --output runs/qualification-v1/m4-tests.evidence.json \
            --log runs/qualification-v1/m4-tests.log \
            --junit runs/qualification-v1/m4-tests.xml \
            --zero-skips \
            -- python -m pytest tests/test_factory_m4*.py \
               tests/test_sandbox_timing_determinism.py::IsolatedTimeoutTypingTests -q \
               --junitxml=runs/qualification-v1/m4-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-m4-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel once
        run: |
          mkdir -p runs/qualification-v1 dist
          python -m pip wheel . --no-deps -w dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum dist/*.whl | tee runs/qualification-v1/wheel.sha256
      - name: Qualify exact wheel bytes
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python scripts/qualification_v1.py run \
            --gate-id exact-wheel \
            --output runs/qualification-v1/exact-wheel.evidence.json \
            --log runs/qualification-v1/exact-wheel.log \
            --evidence-path runs/qualification-v1/exact-wheel-report.json \
            --evidence-path "$WHEEL" \
            -- python scripts/qualify_exact_wheel.py \
               --wheel "$WHEEL" --output runs/qualification-v1/exact-wheel-report.json
      - name: Build and smoke exact container image
        run: |
          python scripts/qualification_v1.py run \
            --gate-id container-smoke \
            --output runs/qualification-v1/container.evidence.json \
            --log runs/qualification-v1/container.log \
            --evidence-path runs/qualification-v1/container-inspect.json \
            -- bash -lc "docker build -t residual-qualification-v1 . && \
              docker image inspect residual-qualification-v1 > runs/qualification-v1/container-inspect.json && \
              docker run --rm --entrypoint python3 residual-qualification-v1 -c \\
                \"from residual.station.service import Station,demo_spec; import tempfile; s=Station(tempfile.mkdtemp()); p=s.create(demo_spec(),demo=True)['project_id']; assert s.batch(p)['integrated']==3\""
      - name: Attest promoted wheel provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.whl'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-artifacts-${{ github.sha }}
          path: |
            runs/qualification-v1
            dist/*.whl
          if-no-files-found: error
          retention-days: 90

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Station and browser dependencies
        run: |
          python -m pip install -e '.[factory,qualification]'
          npm install
          npx playwright install --with-deps '${{ matrix.browser }}'
      - name: Cross-browser Station user journey
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/tests/playwright-browser-shim.cjs
          STATION_QA_DIR: runs/qualification-v1/browser-${{ matrix.browser }}
          STATION_QA_PORT: ${{ matrix.browser == 'chromium' && '8876' || matrix.browser == 'firefox' && '8877' || '8878' }}
        run: |
          mkdir -p "$STATION_QA_DIR"
          python scripts/qualification_v1.py run \
            --gate-id 'browser-${{ matrix.browser }}' \
            --output 'runs/qualification-v1/browser-${{ matrix.browser }}.evidence.json' \
            --log 'runs/qualification-v1/browser-${{ matrix.browser }}.log' \
            --evidence-path "$STATION_QA_DIR/browser-results.json" \
            -- node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-browser-${{ matrix.browser }}-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30


  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[factory,qualification]'
      - name: Real SQLite and authority race campaign
        run: |
          mkdir -p runs/qualification-v1
          python scripts/qualification_v1.py run \
            --gate-id real-concurrency \
            --output runs/qualification-v1/concurrency.evidence.json \
            --log runs/qualification-v1/concurrency.log \
            --junit runs/qualification-v1/concurrency.xml \
            --zero-skips \
            -- python -m pytest tests/qualification/test_concurrency_lab.py -q \
               --junitxml=runs/qualification-v1/concurrency.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-concurrency-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  protocol-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
