      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[factory,qualification]'
      - name: Property-based contract and path fuzzing
        run: |
          mkdir -p runs/qualification-v1
          python scripts/qualification_v1.py run \
            --gate-id protocol-fuzz \
            --output runs/qualification-v1/protocol-fuzz.evidence.json \
            --log runs/qualification-v1/protocol-fuzz.log \
            --junit runs/qualification-v1/protocol-fuzz.xml \
            --zero-skips \
            -- python -m pytest tests/qualification/test_protocol_fuzz.py -q \
               --junitxml=runs/qualification-v1/protocol-fuzz.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-protocol-fuzz-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  toxic-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[factory,qualification]'
      - name: Deterministic toxic-provider matrix
        run: |
          mkdir -p runs/qualification-v1
          python scripts/qualification_v1.py run \
