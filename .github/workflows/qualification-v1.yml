  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[factory,qualification]'
      - name: Windows clean lifecycle and restart qualification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runs/qualification-v1 | Out-Null
          python scripts/qualification_v1.py run --gate-id windows-lifecycle --output runs/qualification-v1/windows.evidence.json --log runs/qualification-v1/windows.log --junit runs/qualification-v1/windows.xml --zero-skips -- python -m pytest tests/station/test_station.py::StationTests::test_full_demo_real_git_tests_review_and_release tests/station/test_station.py::StationTests::test_lease_expiry_and_restart_recovery_preserve_evidence tests/qualification/test_active_workload.py -q --junitxml=runs/qualification-v1/windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-windows-${{ github.sha }}
          path: runs/qualification-v1
