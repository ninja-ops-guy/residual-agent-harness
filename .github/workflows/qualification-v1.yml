      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-macos-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always()
    needs: [deterministic, discovery, m4, artifacts, browser, concurrency, protocol-fuzz, toxic-provider, active-workload, active-http-soak, browser-adversarial, redteam, windows-lifecycle, macos-lifecycle, fault-injection, webvm-protocol-fuzz, qualification-selftests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-v1-*
          path: collected
          merge-multiple: true
      - name: Build one fail-closed release qualification manifest
        run: |
          mkdir -p runs/qualification-v1/final
          python scripts/aggregate_qualification_ci.py \
            --root collected \
            --output runs/qualification-v1/final/qualification-manifest.json
          find collected -type f -print0 | sort -z | xargs -0 sha256sum > runs/qualification-v1/final/evidence-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-final-${{ github.sha }}
          path: runs/qualification-v1/final
          if-no-files-found: error
          retention-days: 90
