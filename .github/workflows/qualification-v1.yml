            --log runs/qualification-v1/redteam.log \
            --junit runs/qualification-v1/redteam.xml \
            --zero-skips \
            -- python -m pytest tests/redteam -q --junitxml=runs/qualification-v1/redteam.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-redteam-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
