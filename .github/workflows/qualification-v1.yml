            --junit runs/qualification-v1/toxic-provider.xml \
            --zero-skips \
            -- python -m pytest tests/qualification/test_toxic_provider_matrix.py \
               tests/qualification/test_provider_mission.py -q \
               --junitxml=runs/qualification-v1/toxic-provider.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-toxic-provider-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  active-workload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[factory,qualification]'
      - name: Active fail-repair-review-integrate-export stress
        run: |
          mkdir -p runs/qualification-v1
          python scripts/qualification_v1.py run \
            --gate-id active-workload \
            --output runs/qualification-v1/active-workload.evidence.json \
            --log runs/qualification-v1/active-workload.log \
            --evidence-path runs/qualification-v1/active-workload-report.json \
            -- python scripts/qualification_active_workload.py \
               --cycles 8 --output runs/qualification-v1/active-workload-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-active-workload-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  browser-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -e '.[factory,qualification]'
          npm install
          npx playwright install --with-deps chromium
      - name: Real job chat and repair browser journey
        env:
          STATION_QA_DIR: runs/qualification-v1/adversarial-browser
          STATION_QA_PORT: '8891'
          TOXIC_PROVIDER_PORT: '8892'
        run: |
          mkdir -p "$STATION_QA_DIR"
          python scripts/qualification_v1.py run \
            --gate-id browser-adversarial-recovery \
            --output runs/qualification-v1/browser-adversarial.evidence.json \
            --log runs/qualification-v1/browser-adversarial.log \
            --evidence-path "$STATION_QA_DIR/adversarial-browser-results.json" \
            -- node tests/qualification/adversarial-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v1-browser-adversarial-${{ github.sha }}
          path: runs/qualification-v1
          if-no-files-found: error
          retention-days: 30

  redteam:
