name: M6-ROADMAP-001B exact-main shipment replication
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  roadmap-001b:
    if: github.head_ref == 'experiment/m6-roadmap-001b-pinned-main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11439
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5-coder:7b
      BASELINE_SHA: 260b5f9e20bf70a6b9ca087bc91e22a009ed77b9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current experimental harness
        run: python -m pip install -e '.[factory]'
      - name: Materialize exact main source baseline
        run: |
          git worktree add --detach /tmp/residual-source "$BASELINE_SHA"
          test "$(git -C /tmp/residual-source rev-parse HEAD)" = "$BASELINE_SHA"
          test -z "$(git -C /tmp/residual-source status --porcelain)"
      - name: Verify repair-loop regressions
        run: |
          python -m unittest \
            tests.station.test_station.StationTests.test_repair_attempt_receives_previous_candidate_without_mutating_fresh_baseline \
            tests.station.test_station.StationTests.test_batch_can_repair_on_fourth_attempt_without_weakening_checks -v
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-roadmap-001b.log 2>&1 &
          echo $! > /tmp/ollama-roadmap-001b.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11439/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-roadmap-001b.log
          exit 1
      - name: Pull implementation model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          ollama --version | tee /tmp/ollama-version-roadmap-001b.txt
          ollama list | tee /tmp/ollama-models-roadmap-001b.txt
          curl -fsS http://127.0.0.1:11439/api/tags > /tmp/ollama-tags-roadmap-001b.json
      - name: Execute authoritative pinned-main trial
        run: python scripts/m6_roadmap_001b_improvementspec.py --source /tmp/residual-source --model "$OLLAMA_MODEL" --base-url http://127.0.0.1:11439 --output runs/m6-roadmap-001b/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-roadmap-001b/evidence.json || cat runs/m6-roadmap-001b/evidence.json
          tail -300 /tmp/ollama-roadmap-001b.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-roadmap-001b-pinned-main-evidence
          path: |
            runs/m6-roadmap-001b
            /tmp/ollama-roadmap-001b.log
            /tmp/ollama-roadmap-001b.pid
            /tmp/ollama-version-roadmap-001b.txt
            /tmp/ollama-models-roadmap-001b.txt
            /tmp/ollama-tags-roadmap-001b.json
