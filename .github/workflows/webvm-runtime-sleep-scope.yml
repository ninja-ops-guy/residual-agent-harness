name: WebVM runtime sleep process-scope discriminator

on:
  pull_request:
    paths:
      - 'demo/vm/runtime_sleep_scope.py'
      - '.github/workflows/webvm-runtime-sleep-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sleep-scope-live-main:
    strategy:
      fail-fast: false
      matrix:
        plan: [split-200-200, split-272-2, single-273]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact published main revision
        id: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run sequential fresh-process sleep discriminator
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          python demo/vm/runtime_sleep_scope.py \
            --url "https://ninja-ops-guy.github.io/residual-agent-harness/demo/" \
            --expected-sha "$MAIN_SHA" \
            --output "runtime-sleep-scope-${{ matrix.plan }}" \
            --plan "${{ matrix.plan }}" \
            --sleep-seconds 0.05
      - name: Retain process-scope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webvm-runtime-sleep-scope-${{ matrix.plan }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-sleep-scope-${{ matrix.plan }}/
          retention-days: 14
          if-no-files-found: warn
