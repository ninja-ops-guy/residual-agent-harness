name: Swarm 3 termination provenance matrix

on:
  pull_request:
    paths:
      - 'residual/factory/runtime.py'
      - 'residual/factory/termination_provenance.py'
      - 'tests/test_factory_runtime.py'
      - 'scripts/factory_termination_matrix.py'
      - '.github/workflows/swarm3-termination-matrix.yml'
      - 'docs/factory/SWARM3_TERMINATION_PROVENANCE.md'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        condition: [normal, cpu, io, combined]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: current
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout historical failing integration tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 83016683188040aea4213aec46cc433caad67766
          path: baseline
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8' 'PyYAML>=6' 'cryptography>=43'
      - name: Historical pre-fix distribution
        env:
          RESIDUAL_REQUIRE_SECCOMP: '1'
        run: |
          python current/scripts/factory_termination_matrix.py \
            --repo-root baseline \
            --condition '${{ matrix.condition }}' \
            --runs 100 \
            --allow-failures \
            --output "current/runs/swarm3/baseline-${{ matrix.condition }}.json"
      - name: Post-fix qualification
        env:
          RESIDUAL_REQUIRE_SECCOMP: '1'
        run: |
          python current/scripts/factory_termination_matrix.py \
            --repo-root current \
            --condition '${{ matrix.condition }}' \
            --runs 500 \
            --output "current/runs/swarm3/post-${{ matrix.condition }}.json"
      - name: Retain matrix evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: swarm3-termination-${{ matrix.condition }}-${{ github.sha }}
          path: current/runs/swarm3
          if-no-files-found: error
          retention-days: 30
