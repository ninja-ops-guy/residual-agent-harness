name: RESIDUAL full live-provider mission

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider
        type: choice
        options: [openai, anthropic, google, openai_compatible]
        required: true
      model:
        description: Exact model identifier
        type: string
        required: true
      base_url:
        description: Optional HTTPS provider or compatible endpoint
        type: string
        required: false

permissions:
  contents: read

jobs:
  live-provider-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[factory,qualification]'
      - name: Execute full provider mission
        env:
          RESIDUAL_CLOUD_API_KEY: ${{ secrets.RESIDUAL_QUALIFICATION_LLM_API_KEY }}
          QUAL_PROVIDER: ${{ inputs.provider }}
          QUAL_MODEL: ${{ inputs.model }}
          QUAL_BASE_URL: ${{ inputs.base_url }}
        run: |
          mkdir -p runs/qualification-provider-mission
          args=(--provider "$QUAL_PROVIDER" --model "$QUAL_MODEL" --output runs/qualification-provider-mission/report.json)
          if [ -n "$QUAL_BASE_URL" ]; then args+=(--base-url "$QUAL_BASE_URL"); fi
          python scripts/qualification_v1.py run \
            --gate-id live-provider-full-mission \
            --output runs/qualification-provider-mission/evidence.json \
            --log runs/qualification-provider-mission/gate.log \
            --evidence-path runs/qualification-provider-mission/report.json \
            --non-claim 'One completed mission is bounded exact-revision provider evidence, not general model-quality evidence.' \
            -- python scripts/qualification_provider_mission.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-provider-mission-${{ github.sha }}-${{ github.run_id }}
          path: runs/qualification-provider-mission
          if-no-files-found: error
          retention-days: 90
