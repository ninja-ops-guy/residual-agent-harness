name: Factory ownership gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fail-closed Factory ownership check
        run: |
          set -o pipefail
          mkdir -p runs/factory-ownership
          git rev-parse HEAD | tee runs/factory-ownership/commit.txt
          python verifier/v3/check_factory_ownership.py 2>&1 | tee runs/factory-ownership/check.txt
      - name: Ownership gate regression tests
        run: |
          set -o pipefail
          python -m unittest tests/test_factory_ownership_gate.py -v 2>&1 | tee runs/factory-ownership/tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: factory-ownership-${{ github.sha }}
          path: runs/factory-ownership
          if-no-files-found: error
          retention-days: 14
