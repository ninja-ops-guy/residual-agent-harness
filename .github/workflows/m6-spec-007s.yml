name: M6-SPEC-007S registry receipt binding controls
on:
  pull_request:
    branches:
      - m6/metric-registry-impl
permissions:
  contents: read
jobs:
  m6-spec-007s:
    if: github.head_ref == 'experiment/m6-spec-007s-registry-binding-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e .
      - name: Qualify Metric Registry
        run: python -m unittest tests.test_discovery_metrics -v
      - name: Syntax-check experiment
        run: python -m py_compile scripts/m6_spec_007s.py
      - name: Run authoritative binding controls
        run: python scripts/m6_spec_007s.py --output runs/m6-spec-007s/evidence.json
      - name: Retain evidence
        if: always()
        run: test ! -f runs/m6-spec-007s/evidence.json || cat runs/m6-spec-007s/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-spec-007s-registry-binding-controls
          path: runs/m6-spec-007s
