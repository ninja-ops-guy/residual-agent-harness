name: Control Plane
on:
  pull_request:
  push:
    branches: ["feat/gateway-control-plane-001"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_control_plane tests.test_control_plane_governance -v
