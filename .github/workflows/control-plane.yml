name: Control Plane
on:
  pull_request:
  push:
    branches: ["feat/gateway-control-plane-001"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_control_plane -v
