name: WebVM runtime sleep threshold discriminator

on:
  pull_request:
    paths:
      - 'demo/vm/runtime_sleep_threshold.py'
      - '.github/workflows/webvm-runtime-sleep-threshold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webvm-threshold:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: sleep-1ms
            sleep_seconds: '0.001'
            iterations: '800'
          - label: sleep-10ms
            sleep_seconds: '0.01'
            iterations: '1600'
          - label: sleep-50ms
            sleep_seconds: '0.05'
            iterations: '400'
          - label: sleep-100ms
            sleep_seconds: '0.1'
            iterations: '400'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve exact published main revision
        id: main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Measure WebVM sleep failure threshold
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        run: |
          set -euo pipefail
          python demo/vm/runtime_sleep_threshold.py \
            --url "https://ninja-ops-guy.github.io/residual-agent-harness/demo/" \
            --expected-sha "$MAIN_SHA" \
            --output "runtime-sleep-threshold-${{ matrix.label }}" \
            --sleep-seconds "${{ matrix.sleep_seconds }}" \
            --iterations "${{ matrix.iterations }}"
      - name: Retain threshold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webvm-runtime-sleep-threshold-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-sleep-threshold-${{ matrix.label }}/
          retention-days: 14
          if-no-files-found: warn

  native-i386-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run equivalent CPython sleeps outside WebVM
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/386 i386/debian:bookworm-slim@sha256:605e8292d9d3e5288094fb9dffd68869a19771546cc11d7c3c777f9d7e0f705d sh -lc '
            apt-get update >/dev/null && apt-get install -y --no-install-recommends python3 >/dev/null &&
            python3 - <<"PY"
          import platform, time
          print("ARCH", platform.architecture()[0])
          for sleep_s, limit in ((0.001, 800), (0.01, 1600), (0.05, 400), (0.1, 400)):
              start = time.monotonic_ns()
              for count in range(1, limit + 1):
                  time.sleep(sleep_s)
              print("NATIVE_I386_PASS", sleep_s, count, time.monotonic_ns() - start)
          PY
          '
