name: M6-SPEC-007K admitted-gap closure
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  m6-spec-007k:
    if: github.head_ref == 'experiment/m6-spec-007k-gap-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11453
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Syntax-check experiment
        run: python -m py_compile scripts/m6_spec_007k.py
      - name: Preflight bound task identity
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path("scripts/m6_spec_007k.py").read_text())
          values=[n.value for n in ast.walk(tree) if isinstance(n,ast.Constant) and n.value=="m6-discover-007k"]
          assert len(values)==1, f"expected one literal TASK_ID definition, found {len(values)}"
          PY
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-m6-spec-007k.log 2>&1 &
          echo $! > /tmp/ollama-m6-spec-007k.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11453/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6-spec-007k.log
          exit 1
      - name: Pull analysis model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          ollama --version
          ollama list | tee /tmp/ollama-models-m6-spec-007k.txt
          sha256sum scripts/m6_spec_007k.py | tee /tmp/m6-spec-007k-script-sha256.txt
      - name: Execute authoritative gap-closure discovery trial
        run: python scripts/m6_spec_007k.py --model "$OLLAMA_MODEL" --base-url http://127.0.0.1:11453 --output runs/m6-spec-007k/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-spec-007k/evidence.json || cat runs/m6-spec-007k/evidence.json
          tail -300 /tmp/ollama-m6-spec-007k.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-spec-007k-gap-closure-evidence
          path: |
            runs/m6-spec-007k
            /tmp/ollama-m6-spec-007k.log
            /tmp/ollama-m6-spec-007k.pid
            /tmp/ollama-models-m6-spec-007k.txt
            /tmp/m6-spec-007k-script-sha256.txt
