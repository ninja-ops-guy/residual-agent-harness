name: Derivation graph precision controls
on:
  pull_request:
    branches:
      - m6/derivation-graph-core
permissions:
  contents: read
jobs:
  precision-controls:
    if: github.head_ref == 'experiment/dg-precision-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e .
      - name: Syntax preflight
        run: python -m py_compile residual/derivation.py residual/metric_expr.py residual/environment_contract.py tests/test_derivation.py tests/test_metric_expr.py tests/test_environment_contract.py
      - name: Run authoritative precision controls
        run: python -m unittest tests.test_derivation tests.test_metric_expr tests.test_environment_contract -v
