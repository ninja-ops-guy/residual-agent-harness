name: M6-ROADMAP-001D immutable ImprovementSpec
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  roadmap-001d:
    if: github.head_ref == 'experiment/m6-roadmap-001d-external-verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11441
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5-coder:7b
      BASELINE_SHA: 260b5f9e20bf70a6b9ca087bc91e22a009ed77b9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research harness
        run: python -m pip install -e '.[factory]'
      - name: Materialize exact production source
        run: |
          git worktree add --detach /tmp/residual-source "$BASELINE_SHA"
          test "$(git -C /tmp/residual-source rev-parse HEAD)" = "$BASELINE_SHA"
          test -z "$(git -C /tmp/residual-source status --porcelain)"
      - name: Validate repair diagnostics
        run: |
          python -m unittest \
            tests.station.test_station.StationTests.test_repair_detail_retains_terminal_root_cause_within_bound \
            tests.station.test_station.StationTests.test_repeated_failed_patch_is_explicit_repair_finding \
            tests.station.test_station.StationTests.test_repair_attempt_receives_previous_candidate_without_mutating_fresh_baseline \
            tests.station.test_station.StationTests.test_batch_can_repair_on_fourth_attempt_without_weakening_checks -v
      - name: Validate external acceptance fixture
        run: |
          python -m py_compile scripts/research_checks/m6_improvement_spec_acceptance.py
          sha256sum scripts/research_checks/m6_improvement_spec_acceptance.py
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-roadmap-001d.log 2>&1 &
          echo $! > /tmp/ollama-roadmap-001d.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11441/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-roadmap-001d.log
          exit 1
      - name: Pull implementation model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          ollama --version | tee /tmp/ollama-version-roadmap-001d.txt
          ollama list | tee /tmp/ollama-models-roadmap-001d.txt
          curl -fsS http://127.0.0.1:11441/api/tags > /tmp/ollama-tags-roadmap-001d.json
      - name: Execute authoritative immutable-contract trial
        run: |
          python scripts/m6_roadmap_001d_immutable_spec.py \
            --source /tmp/residual-source \
            --check-script "$GITHUB_WORKSPACE/scripts/research_checks/m6_improvement_spec_acceptance.py" \
            --model "$OLLAMA_MODEL" \
            --base-url http://127.0.0.1:11441 \
            --output runs/m6-roadmap-001d/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-roadmap-001d/evidence.json || cat runs/m6-roadmap-001d/evidence.json
          tail -300 /tmp/ollama-roadmap-001d.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-roadmap-001d-immutable-spec-evidence
          path: |
            runs/m6-roadmap-001d
            scripts/research_checks/m6_improvement_spec_acceptance.py
            /tmp/ollama-roadmap-001d.log
            /tmp/ollama-roadmap-001d.pid
            /tmp/ollama-version-roadmap-001d.txt
            /tmp/ollama-models-roadmap-001d.txt
            /tmp/ollama-tags-roadmap-001d.json
