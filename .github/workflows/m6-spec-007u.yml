name: M6-SPEC-007U minimal Planner envelope
on:
  pull_request:
    branches:
      - m6/metric-registry-impl
permissions:
  contents: read
jobs:
  m6-spec-007u:
    if: github.head_ref == 'experiment/m6-spec-007u-minimal-planner-envelope'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLLAMA_HOST: 127.0.0.1:11461
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MODEL: qwen2.5:7b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RESIDUAL
        run: python -m pip install -e '.[factory]'
      - name: Syntax-check experiment
        run: python -m py_compile scripts/m6_spec_007u.py
      - name: Qualify Metric Registry
        run: python -m unittest tests.test_discovery_metrics -v
      - name: Preflight minimal Planner schema
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("scripts/m6_spec_007u.py")
          spec=importlib.util.spec_from_file_location("m6_007u",p)
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          wire=str(mod.PLANNER_SCHEMA)
          for forbidden in ("observation","preserve_invariants","evidence_snapshot_hash","metric_registry_sha256","human_approval_required"):
              assert forbidden not in wire, forbidden
          PY
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start dedicated Ollama endpoint
        run: |
          nohup ollama serve > /tmp/ollama-m6-spec-007u.log 2>&1 &
          echo $! > /tmp/ollama-m6-spec-007u.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11461/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-m6-spec-007u.log
          exit 1
      - name: Pull analysis model
        run: ollama pull "$OLLAMA_MODEL"
      - name: Record runtime identity
        run: |
          ollama --version
          ollama list | tee /tmp/ollama-models-m6-spec-007u.txt
          sha256sum scripts/m6_spec_007u.py residual/discovery_metric_registry.json | tee /tmp/m6-spec-007u-input-sha256.txt
      - name: Execute authoritative minimal-Planner trial
        run: python scripts/m6_spec_007u.py --model "$OLLAMA_MODEL" --base-url http://127.0.0.1:11461 --output runs/m6-spec-007u/evidence.json
      - name: Retain evidence
        if: always()
        run: |
          test ! -f runs/m6-spec-007u/evidence.json || cat runs/m6-spec-007u/evidence.json
          tail -300 /tmp/ollama-m6-spec-007u.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-spec-007u-minimal-planner-evidence
          path: |
            runs/m6-spec-007u
            /tmp/ollama-m6-spec-007u.log
            /tmp/ollama-m6-spec-007u.pid
            /tmp/ollama-models-m6-spec-007u.txt
            /tmp/m6-spec-007u-input-sha256.txt
